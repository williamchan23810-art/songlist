<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download - William H Chan Music Studio</title>
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center;
        }

        .container {
            background-color: #1a1a1a;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #444;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.7);
            max-width: 400px;
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background-color: #ffcc00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: #000;
            font-size: 40px;
            font-weight: bold;
        }

        h1 { color: #ffcc00; margin-bottom: 10px; }
        p { color: #ccc; line-height: 1.6; margin-bottom: 30px; }

        .btn {
            background-color: #ffcc00;
            color: #000;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            display: inline-block;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            background-color: #fff;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover { color: #ffcc00; }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-circle">♪</div>
        <h1>Get the App</h1>
        <p>You're one step away from the full Music Studio experience. Access the complete song library and lyrics on your device.</p>
        
        <a href="#" class="btn">INSTALL NOW</a>

        <a href="index.html" class="back-link">← Return to Studio</a>
    </div>

</body>
</html>
