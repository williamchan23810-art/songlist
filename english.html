<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>William H Chan Music Studio - English Songs</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        :root { --primary-blue: #3498db; --secondary: #457b9d; --bg: #f8f9fa; --text: #1d3557; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); max-width: 800px; margin: 0 auto; padding: 10px; }
        
        /* Master Header (Arrow, Disc, QR) */
        .master-header-container { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; width: 100%; box-sizing: border-box; }
        .nav-home { font-size: 32px; text-decoration: none; color: #333; width: 60px; font-weight: bold; }
        
        @keyframes slowSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .logo-center { width: 80px; height: 80px; object-fit: cover; border-radius: 50%; border: 2px solid #333; animation: slowSpin 5s linear infinite; }
        .qr-static { width: 65px; height: 65px; border: 1px solid #ddd; border-radius: 4px; }

        /* STUDIO TITLE (Cambria Font Fix) */
        .studio-title { text-align: center; margin-top: 10px; }
        .studio-title h1 { 
            font-family: 'Cambria', 'Georgia', 'Times New Roman', serif !important; 
            font-size: 1.5rem; 
            margin: 0; 
            color: #333; 
            font-weight: bold; 
            letter-spacing: 0.5px;
        }
        
        .divider { height: 2px; background-color: var(--secondary); margin: 15px 0; width: 100%; }
        #search-box { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; outline: none; }

        .song-card { background: white; margin-bottom: 8px; padding: 12px 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .details { flex: 1; margin-right: 10px; }
        .artist { font-size: 0.75rem; font-weight: bold; color: var(--secondary); text-transform: uppercase; display: block; margin-bottom: 2px; }
        .song-name { font-size: 1rem; font-weight: 600; color: #333; line-height: 1.2; }

        .actions { display: flex; gap: 8px; }
        .btn { text-decoration: none; padding: 8px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; color: white; min-width: 65px; text-align: center; }
        .btn-orig { background-color: var(--primary-blue); }
        .btn-kara { background-color: #2c3e50; } /* Dark Blue for English Sing */

        #status { text-align: center; font-style: italic; color: #888; margin-top: 40px; }
    </style>
</head>
<body>

    <div class="master-header-container">
        <a href="index.html" class="nav-home">←</a>
        <img src="turntable-Icon.jpg" alt="Logo" class="logo-center">
        <img src="qr-code.png" alt="QR" class="qr-static">
    </div>

    <div class="studio-title">
        <h1>William H Chan Music Studio</h1>
    </div>

    <div class="divider"></div>

    <input type="text" id="search-box" placeholder="Search English singer or song..." onkeyup="filterSongs()">

    <div id="status">Syncing English Library...</div>
    <div id="song-list-container"></div>

    <script>
        // Use the new CSV link you provided
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRURv3BhrTaAjayuts-7v61qTznVRxe-0hyvgevw8wIj3OHTvQLnGiLOc8TdwD0CvKNrRS_U3qj2o33/pub?gid=0&single=true&output=csv';

        function renderSongs(data) {
            const container = document.getElementById('song-list-container');
            container.innerHTML = '';
            
            for (let i = 1; i < data.length; i++) {
                const row = data[i];
                // Mapping: A=0 (Artist), B=1 (Song), C=2 (Orig), D=3 (Kara)
                const artistName = row[0] ? row[0].trim() : "";
