<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>William H Chan Music Studio</title>

    <link rel="apple-touch-icon" href="icon-192.jpg">
    <link rel="icon" type="image/jpeg" sizes="192x192" href="icon-192.jpg">
    
    <style>
        /* 1. Global Setup */
        body { 
            font-family: -apple-system, sans-serif; 
            background-color: #ffffff; /* White background for seamless blend */
            margin: 0; 
            padding: 0;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }

        /* 2. THE IMMERSIVE IMAGE: No borders, full width */
        .immersive-hero { 
            width: 100%; 
            height: auto;
            display: block;
            margin: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); /* Adds depth to the photo */
        }

        /* 3. THE MENU SECTION: Slides up slightly to meet the photo */
        .menu-section { 
            background: white; 
            width: 100%; 
            max-width: 500px; 
            margin-top: -20px; /* The "overlap" trick for immersive design */
            border-radius: 25px 25px 0 0; 
            padding: 30px 20px;
            text-align: center;
            box-sizing: border-box;
            z-index: 10;
        }
        
        h1 { 
            font-family: 'Cambria', 'Georgia', serif !important; 
            color: #333; 
            margin: 0 0 10px 0; 
            font-size: 1.8rem; 
            font-weight: bold;
        }
        
        p { 
            color: #888; 
            margin-bottom: 30px; 
            font-size: 0.9rem; 
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* 4. BUTTONS */
        .btn-menu { 
            display: block; 
            text-decoration: none; 
            color: white; 
            padding: 18px; 
            margin: 15px 0; 
            border-radius: 15px; 
            font-weight: bold; 
            font-size: 1.1rem; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        
        .btn-lady { background: #d81b60; }
        .btn-men  { background: #2e7d32; }
        .btn-duet { background: #8e44ad; }
        .btn-eng  { background: #3498db; }
        
        .btn-menu:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <img src="JP.jpg" alt="William H Chan Music Studio" class="immersive-hero">

    <div class="menu-section">
        <h1>William H Chan Music Studio</h1>
        <p>Choose a Category</p>

        <a href="chinese-lady.html" class="btn-lady btn-menu">CHINESE LADY</a>
        <a href="chinese-men.html" class="btn-men btn-menu">CHINESE MEN</a>
        <a href="chinese-duet.html" class="btn-duet btn-menu">CHINESE DUET</a>
        <a href="english.html" class="btn-eng btn-menu">ENGLISH SONGS</a>
    </div>

</body>
</html>
