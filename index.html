<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>William H Chan Music Studio</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .menu-container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        
        /* Hero Image Style */
        .hero-img { 
            width: 100%; 
            height: 220px; 
            object-fit: cover; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            display: block;
            background-color: #eee; 
        }

        h1 { font-family: 'Cambria', 'Georgia', serif !important; color: #333; margin: 10px 0; font-size: 1.6rem; font-weight: bold; }
        p { color: #666; margin-bottom: 20px; font-size: 0.9rem; }

        .btn-menu { display: block; text-decoration: none; color: white; padding: 14px; margin: 10px 0; border-radius: 12px; font-weight: bold; font-size: 1.1rem; }
        .btn-lady { background: #d81b60; }
        .btn-men { background: #2e7d32; }
        .btn-duet { background: #8e44ad; }
        .btn-eng { background: #3498db; }
    </style>
</head>
<body>
    <div class="menu-container">
        <img src="JP.jpg" alt="William H Chan Music Studio" class="hero-img">
        
        <h1>William H Chan Music Studio</h1>
        <p>Select a Category</p>
        <a href="chinese-lady.html" class="btn-lady btn-menu">CHINESE LADY</a>
        <a href="chinese-men.html" class="btn-men btn-menu">CHINESE MEN</a>
        <a href="chinese-duet.html" class="btn-duet btn-menu">CHINESE DUET</a>
        <a href="english.html" class="btn-eng btn-menu">ENGLISH SONGS</a>
    </div>
</body>
</html>
