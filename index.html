<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>William H Chan Music Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --primary: #e63946; --secondary: #457b9d; --bg: #f8f9fa; --text: #1d3557; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); max-width: 800px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid var(--secondary); }
        #search-box { width: 100%; padding: 15px; font-size: 18px; border: 2px solid #ddd; border-radius: 10px; margin-bottom: 20px; box-sizing: border-box; }
        .song-card { background: white; margin-bottom: 10px; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .details { flex: 1; }
        .artist { font-size: 0.8rem; font-weight: bold; color: var(--secondary); text-transform: uppercase; display: block; }
        .song-name { font-size: 1.1rem; font-weight: 600; }
        .actions { display: flex; gap: 8px; }
        .btn { text-decoration: none; padding: 8px 15px; border-radius: 6px; font-size: 13px; font-weight: bold; color: white; transition: 0.2s; min-width: 80px; text-align: center; }
        .btn-orig { background-color: #3498db; }
        .btn-kara { background-color: #e63946; }
        .btn:hover { opacity: 0.8; }
        #loading { text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>English Song List</h1>
    </header>

    <input type="text" id="search-box" placeholder="Search song or artist..." onkeyup="filterSongs()">

    <div id="loading">Updating library from Google Sheets...</div>
    <div id="song-list-container"></div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRURv3BhrTaAjayuts-7v61qTznVRxe-0hyvgevw8wIj3OHTvQLnGiLOc8TdwD0CvKNrRS_U3qj2o33/pub?output=csv';

        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            complete: function(results) {
                const container = document.getElementById('song-list-container');
                container.innerHTML = '';
                results.data.forEach(row => {
                    const song = row['SONG'];
                    if (!song) return;

                    // Matching your specific column names exactly
                    const origLink = row['ORIGINAL LINK'];
                    const karaLink = row['KARAOKE LINK'];

                    const div = document.createElement('div');
                    div.className = 'song-card';
                    div.innerHTML = `
                        <div class="details">
                            <span class="artist">${row['ARTIST'] || ''}</span>
                            <span class="song-name">${song}</span>
                        </div>
                        <div class="actions">
                            ${origLink ? `<a href="${origLink}" target="_blank" class="btn btn-orig">Original</a>` : ''}
                            ${karaLink ? `<a href="${karaLink}" target="_blank" class="btn btn-kara">Karaoke</a>` : ''}
                        </div>
                    `;
                    container.appendChild(div);
                });
                document.getElementById('loading').style.display = 'none';
            }
        });

        function filterSongs() {
            const term = document.getElementById('search-box').value.toLowerCase();
            const cards = document.getElementsByClassName('song-card');
            Array.from(cards).forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(term) ? 'flex' : 'none';
            });
        }
    </script>
</body>
</html>
</html>
