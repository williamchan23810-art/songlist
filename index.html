<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>William H Chan Music Studio</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            position: relative;
        }

        /* This creates the 10% opacity background layer */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Make sure this matches the filename on GitHub exactly (case-sensitive) */
            background-image: url('JP.png'); 
            background-size: cover;
            background-position: center;
            opacity: 0.1; /* 10% Opacity */
            z-index: -1; 
            pointer-events: none;
        }

        .container { 
            text-align: center; 
            background: rgba(255, 255, 255, 0.9); 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 90%; 
            max-width: 400px; 
            position: relative;
            z-index: 1;
        }

        h1 { color: #333; margin-bottom: 25px; font-size: 1.5rem; }
        
        .menu-btn {
            display: block;
            width: 100%;
            padding: 15px 0;
            margin: 10px 0;
            text-decoration: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            transition: transform 0.2s, background-color 0.2s;
            font-size: 1.1rem;
        }

        /* Adding a slight hover effect for a modern feel */
        .menu-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .menu-btn:active { transform: scale(0.98); }

        /* Button Colors */
        .btn-lady { background-color: #d81b60; } 
        .btn-men  { background-color: #27ae60; } 
        .btn-duet { background-color: #8e44ad; } 
        .btn-eng  { background-color: #2980b9; } 

        .footer { margin-top: 20px; font-size: 0.8rem; color: #777; }
    </style>
</head>
<body>

    <div class="container">
