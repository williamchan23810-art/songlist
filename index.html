<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>William H Chan Music Studio</title>
    <style>
        /* This CSS is designed to be impossible to hide */
        body { 
            background-color: #000 !important; 
            color: #fff !important; 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px;
        }

        .main-container {
            border: 2px solid yellow; /* This will show us the box exists */
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .hero {
            position: relative;
            background-color: #222;
            min-height: 300px;
            margin-bottom: 20px;
        }

        .hero img {
            width: 100%;
            height: auto;
            display: block;
        }

        .cta-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 80px;
            z-index: 99;
        }

        .grid {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
        }

        .box {
            border: 1px solid #fff;
            padding: 20px;
            flex: 1;
            min-width: 120px;
            text-decoration: none;
            color: #fff;
            background: #111;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>WILLIAM H CHAN MUSIC STUDIO</h1>
        <p>If you see this text, the code is working!</p>

        <div class="hero">
            <img src="JP.jpg" alt="[Jimmy Page Photo Loading...]">
            
            <a href="download.html" class="cta-icon">
                <img src="icon-download-cta.jpg" alt="Download">
            </a>
        </div>

        <div class="grid">
            <a href="https://youtube.com" class="box">Canto-pop</a>
            <a href="https://youtube.com" class="box">Mando-pop</a>
            <a href="https://youtube.com" class="box">Latest</a>
            <a href="library.html" class="box">Library</a>
        </div>
    </div>

</body>
</html>
