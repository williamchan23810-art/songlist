<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>William H Chan Music Studio</title>
    <style>
        /* Immersive background logic */
        body { 
            font-family: -apple-system, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        
        /* 1. The Immersive Image - Unconstrained */
        .immersive-hero { 
            width: 100%; 
            max-width: 500px; /* Limits size on large screens but fills mobile */
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* 2. The Menu Container - Overlapping slightly for a modern look */
        .menu-container { 
            background: white; 
            padding: 30px 20px; 
            border-radius: 25px 25px 0 0; /* Rounded only at top */
            box-shadow: 0 -10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 500px; 
            text-align: center;
            margin-top: -20px; /* Pulls the menu up over the photo slightly */
            flex-grow: 1; /* Ensures white area fills the rest of the screen */
        }
        
        h1 { 
            font-family: 'Cambria', 'Georgia', serif !important; 
            color: #333 !important; 
            margin: 10px 0 5px 0 !important; 
            font-size: 1.6rem !important; 
            font-weight: bold !important;
        }
        
        p { color: #666; margin-bottom: 25px; font-size: 0.95rem; letter-spacing: 1px; }

        .btn-menu { 
            display: block; 
            text-decoration: none; 
            color: white; 
            padding: 16px; 
            margin: 12px 0; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 1.1rem; 
            transition: 0.2s;
        }
        
        .btn-lady { background: #d81b60; }
        .btn-men { background: #2e7d32; }
        .btn-duet { background: #8e44ad; }
        .btn-eng { background: #3498db; }
        
        .btn-menu:active { transform: scale(0.97); opacity: 0.9; }
    </style>
</head>
<body>

    <img src="JP.jpg" alt="William H Chan Music Studio" class="immersive-hero">

    <div class="menu-container">
        <h1>William H Chan Music Studio</h1>
        <p>CHOOSE A CATEGORY</p>

        <a href="chinese-lady.html" class="btn-lady btn-menu">CHINESE LADY</a>
        <a href="chinese-men.html" class="btn-men btn-menu">CHINESE MEN</a>
        <a href="chinese-duet.html" class="btn-duet btn-menu">CHINESE DUET</a>
        <a href="english.html" class="btn-eng btn-menu">ENGLISH SONGS</a>
    </div>

</body>
</html>
