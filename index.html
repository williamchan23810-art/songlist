<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>William H Chan Music Studio</title>
    
    <link rel="apple-touch-icon" href="icon-download-cta.jpg">
    <meta name="mobile-web-app-capable" content="yes">

    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
            padding: 20px 10px;
        }

        h1 { margin: 10px 0 20px 0; font-weight: 300; letter-spacing: 2px; font-size: 24px; }

        /* HERO SECTION: Jimmy Page + Download Icon */
        .hero-container {
            position: relative;
            display: inline-block;
            max-width: 850px;
            margin-bottom: 20px;
        }

        .hero-image {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #333;
        }

        /* The Download Record Icon */
        .floating-cta {
            position: absolute;
            right: 4%;      
            top: 50%;       
            transform: translateY(-50%);
            z-index: 100;
            text-decoration: none;
            text-align: center;
        }

        .floating-cta img {
            width: 90px;
            transition: 0.3s ease;
            filter: drop-shadow(0px 4px 15px rgba(0,0,0,0.8));
        }

        .floating-cta img:hover { transform: scale(1.1); }

        .cta-label {
            display: block;
            background: #ffcc00;
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 8px;
            font-size: 11px;
        }

        /* NAVIGATION GRID (The 4 Boxes) */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 850px;
        }

        .nav-box {
            background-color: #1a1a1a;
            border: 1px solid #444;
            padding: 20px 5px;
            text-align: center;
            text-decoration: none;
            color: white;
            border-radius: 8px;
            transition: 0.3s;
        }

        .nav-box:hover {
            border-color: #ffcc00;
            background-color: #222;
            transform: translateY(-3px);
        }

        .nav-box h3 { margin: 0; font-size: 16px; color: #ffcc00; }
        .nav-box p { margin: 5px 0 0 0; font-size: 12px; color: #bbb; }

        /* Version Footer */
        .footer {
            margin-top: 40px;
            color: #444;
            font-size: 12px;
            text-align: center;
        }

            .nav-grid { grid-template-columns: 1fr 1fr
