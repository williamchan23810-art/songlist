<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 40px 20px;
        }

        /* The Hero Section with Jimmy Page */
        .hero-container {
            position: relative;
            display: inline-block;
            margin-bottom: 30px;
        }

        .hero-image {
            display: block;
            width: 100%;
            max-width: 900px;
            height: auto;
            border: 1px solid #333;
            border-radius: 4px;
        }

        .floating-cta {
            position: absolute;
            right: 5%;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            text-decoration: none;
        }

        .floating-cta img {
            width: 100px;
            transition: 0.3s;
            filter: drop-shadow(0px 0px 10px rgba(0,0,0,0.8));
        }

        .floating-cta img:hover { transform: scale(1.1); }

        .cta-label {
            display: block;
            background: #ffcc00;
            color: #000;
            padding: 5px;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            margin-top: 8px;
            font-size: 12px;
        }

        /* THE 4 BOXES SECTION */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* Creates 4 equal columns */
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin-top: 20px;
        }

        .nav-box {
            background-color: #1a1a1a;
            border: 1px solid #444;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: white;
            border-radius: 8px;
            transition: background 0.3s, transform 0.3s;
        }

        .nav-box:hover {
            background-color: #333;
            transform: translateY(-5px);
            border-color: #ffcc00;
        }

        .nav-box h3 { margin: 0 0 10px 0; font-size: 16px; color: #ffcc00; }
        .nav-box p { margin: 0; font-size: 13px; color: #ccc; }

        /* Responsive: Stack boxes on mobile */
        @media (max-width: 600px) {
            .nav-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <h1>William H Chan Music Studio</h1>

    <div class="hero-container">
        <img src="JP.jpg" alt="Jimmy Page" class="hero-image">
        <a href="download.html" class="floating-cta">
            <img src="icon-download-cta.jpg" alt="Download">
            <span class="cta-label">DOWNLOAD APP</span>
        </a>
    </div>

    <div class="nav-grid">
        <a href="library.html" class="nav-box">
            <h3>Music Library</h3>
            <p>Browse Songs</p>
        </a>
        <a href="https://youtube.com/@WilliamHChanMusicStudio" class="nav-box">
            <h3>YouTube</h3>
            <p>Karaoke Videos</p>
        </a>
        <a href="about.html" class="nav-box">
            <h3>Studio Bio</h3>
            <p>Our Story</p>
        </a>
        <a href="contact.html" class="nav-box">
            <h3>Contact</h3>
            <p>Get in Touch</p>
        </a>
    </div>

</body>
</html>
