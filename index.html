<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>William H Chan Music Studio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 40px; font-size: 2.5rem; color: #f1c40f; text-align: center; }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 90%;
            max-width: 400px;
        }
        .btn {
            padding: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            color: white;
            border-radius: 12px;
            transition: transform 0.2s, background-color 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn:hover { transform: scale(1.03); }
        
        /* Specific Colors for each list */
        .btn-english { background-color: #2980b9; } 
        .btn-men { background-color: #27ae60; }     
        .btn-lady { background-color: #d81b60; }    
    </style>
</head>
<body>

    <h1>William H Chan Music Studio <br> 安清</h1>

    <div class="container">
        <a href="english.html" class="btn btn-english">English Songlist</a>

        <a href="chinese-men.html" class="btn btn-men">Chinese Men Songlist</a>

        <a href="chinese-lady.html" class="btn btn-lady">Chinese Lady Songlist</a>
    </div>

</body>
</html>
