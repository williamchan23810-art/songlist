<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>William H Chan Music Studio</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            position: relative;
        }

        /* The Background Layer - Brown Tone and 40% Opacity */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('JP.jpg'); /* Ensures connection to your GitHub file */
            background-size: cover;
            background-position: center;
            
            /* Color Tone (Warm Brown/Sepia) */
            filter: sepia(100%) hue-rotate(-20deg) brightness(1.1); 
            
            /* Opacity (40%) */
            opacity: 0.4; 
            
            z-index: -1; 
            pointer-events: none;
        }

        .container { 
            text-align: center; 
            /* CHANGE 1: Fully transparent background */
            background: transparent; 
            padding: 30px; 
            width: 90%; 
            max-width: 400px; 
            z-index: 1;
            /* CHANGE 2: Removed box-shadow and border-radius for maximum immersion */
        }

        h1 { 
            /* CHANGE 3: Text color updated to white for contrast against sepia image */
            color: #ffffff; 
            margin-bottom: 25px; 
            font-size: 1.6rem; 
            font-weight: 700;
            /* CHANGE 4: Added text-shadow to ensure readability over darker image areas */
            text-shadow: 1px 1px 4px rgba(0,0,0,0.6); 
        }
        
        .menu-btn {
            display: block;
            width: 100%;
            padding: 15px 0;
            margin: 10px 0;
            text-decoration: none;
            color: white; /* Links text remains white against button colors */
            font-weight: bold;
            border-radius: 8px;
            transition: transform 0.2s, filter 0.2s;
            font-size: 1.1rem;
            -webkit-tap-highlight-color: transparent; /* Clean mobile experience */
        }

        .menu-btn:hover { filter: brightness(1.1); }
        .menu-btn:active { transform: scale(0.98); }

        /* Studio Color Coding */
        .btn-lady { background-color: #d81b60; } 
        .btn-men  { background-color: #27ae60; } 
        .btn-duet { background-color: #8e44ad; } 
        .btn-eng  { background-color: #2980b9; } 

        .footer { 
            margin-top: 30px; 
            font-size: 0.8rem; 
            /* CHANGE 5: Footer text updated to a lighter color for visibility */
            color: #d0d0d0; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Music Studio Songlists</h1>
        
        <a href="chinese-lady.html" class="menu-btn btn-lady">Chinese Lady Songs</a>
        <a href="chinese-men.html" class="menu-btn btn-men">Chinese Men Songs</a>
        <a href="chinese-duet.html" class="menu-btn btn-duet">Chinese Duets</a>
        <a href="english.html" class="menu-btn btn-eng">English Songs</a>

        <div class="footer">
            &copy; 2026 William H Chan Music Studio
        </div>
    </div>

</body>
</html>
