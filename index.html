<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>William H Chan Music Studio</title>
    <style>
        /* Container for the Jimmy Page image and the floating CTA */
        .hero-container {
            position: relative;
            display: inline-block;
            max-width: 100%; /* Ensures it fits on mobile screens */
            margin: 20px auto;
        }

        /* The background picture of Jimmy Page */
        .hero-image {
            display: block;
            width: 100%;
            max-width: 800px; /* Adjust this based on your image size */
            height: auto;
            border-radius: 8px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
        }

        /* The clickable CTA icon positioning */
        .floating-cta {
            position: absolute;
            right: 8%;      /* Adjust this to move it left/right relative to Jimmy */
            top: 50%;       /* Centers it vertically in the middle */
            transform: translateY(-50%);
            z-index: 10;
            text-decoration: none; /* Removes underline if any */
        }

        /* Styling the specific icon image */
        .floating-cta img {
            width: 90px;    /* Slightly larger to be easily clickable */
            height: auto;
            cursor: pointer;
            transition: all 0.3s ease;
            filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.6));
        }

        /* Hover animation: the record pops and glows slightly */
        .floating-cta img:hover {
            transform: scale(1.15) rotate(5deg);
            filter: drop-shadow(0px 0px 12px rgba(255, 255, 255, 0.4));
        }

        /* Optional: Text label under the icon */
        .cta-label {
            display: block;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-top: 5px;
            text-align: center;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div class="hero-container">
    <img src="jimmy-page.jpg" alt="Jimmy Page" class="hero-image">

    <a href="download.html" class="floating-cta">
        <img src="icon-download-cta.jpg" alt="Download Music Studio App">
        <span class="cta-label">DOWNLOAD APP</span>
    </a>
</div>

</body>
</html>
