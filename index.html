<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>William H Chan Music Studio</title>
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
            padding: 40px 10px;
        }

        /* 1. THE HERO SECTION (Jimmy & Icon) */
        .hero-container {
            position: relative;
            display: inline-block;
            margin-bottom: 40px;
        }

        .hero-image {
            display: block;
            width: 100%;
            max-width: 800px;
            height: auto;
            border: 1px solid #333;
        }

        .floating-cta {
            position: absolute;
            right: 5%;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            text-decoration: none;
        }

        .floating-cta img {
            width: 100px;
            filter: drop-shadow(0px 0px 15px rgba(0,0,0,1));
            transition: 0.3s;
        }

        .floating-cta img:hover { transform: scale(1.1); }

        .cta-label {
            display: block;
            background: #ffcc00;
            color: #000;
            padding: 5px;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            margin-top: 5px;
            font-size: 12px;
        }

        /* 2. THE 4 BOXES SECTION (Navigation) */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 columns */
            gap: 15px;
            width: 100%;
            max-width: 800px;
        }

        .nav-box {
            border: 2px solid #ffffff; /* White border so they ARE visible */
            background-color: #1a1a1a;
            padding: 20px 10px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            border-radius: 10px;
            transition: 0.3s;
        }

        .nav-box:hover {
            background-color: #ffcc00;
            color: #000;
            border-color: #ffcc00;
        }

        .nav-box h3 { margin: 0; font-size: 16px; }

        /* Responsive for mobile */
        @media (max-width: 600px) {
            .nav-grid { grid-template-columns: 1fr 1fr; } /* 2x2 on phones */
        }
    </style>
</head>
<body>

    <h1>William H Chan Music Studio</h1>

    <div class="hero-container">
        <img src="JP.jpg" alt="Jimmy Page" class="hero-image">
        
        <a href="download.html" class="floating-cta">
            <img src="icon-download-cta.jpg" alt="Download">
            <span class="cta-label">DOWNLOAD APP</span>
        </a>
    </div>

    <div class="nav-grid">
        <a href="library.html" class="nav-box">
            <h3>Music Library</h3>
        </a>
        <a href="https://youtube.com/@WilliamHChanMusicStudio" target="_blank" class="nav-box">
            <h3>YouTube</h3>
        </a>
        <a href="about.html" class="nav-box">
            <h3>Our Story</h3>
        </a>
        <a href="contact.html" class="nav-box">
            <h3>Contact</h3>
        </a>
    </div>

</body>
</html>
