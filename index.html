<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>William H Chan Music Studio</title>
    
    <link rel="apple-touch-icon" href="icon-download-cta.jpg">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="manifest" href="manifest.json">

    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
            padding: 20px 10px;
        }

        h1 { margin: 10px 0 20px 0; font-weight: 300; letter-spacing: 2px; font-size: 22px; }

        /* HERO SECTION: Jimmy Page + Download Icon */
        .hero-container {
            position: relative;
            display: inline-block;
            max-width: 850px;
            margin-bottom: 20px;
        }

        .hero-image {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #333;
        }

        /* The Clickable Record Icon */
        .floating-cta {
            position: absolute;
            right: 4%;      
            top: 50%;       
            transform: translateY(-50%);
            z-index: 100;
            text-decoration: none;
            text-align: center;
        }

        .floating-cta img {
            width: 90px;
            transition: 0.3s ease;
            filter: drop-shadow(0px 4px 15px rgba(0,0,0,0.8));
        }

        .floating-cta img:hover { transform: scale(1.1); }

        .cta-label {
            display: block;
            background: #ffcc00;
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 8px;
            font-size: 11px;
        }

        /* THE 4 SONG CATEGORY BOXES */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 850px;
        }

        .box {
            background-color: #1a1a1a;
            border: 1px solid #444;
            padding: 25px 5px;
            text-align: center;
            text-decoration: none;
            color: #ffcc00;
            border-radius: 10px;
            transition: 0.3s;
            font-weight: bold;
        }

        .box span {
            display: block;
            color: #bbb;
            font-size: 11px;
            font-weight: normal;
            margin-top: 8px;
            text-transform: uppercase;
        }

        .box:hover {
            border-color: #ffcc00;
            background-color: #222;
            transform: translateY(-3px);
        }

        /* Mobile Layout Adjustment */
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr 1fr; }
            .floating-cta img { width: 75px; }
        }
    </style>
</head>
<body>

    <h1>WILLIAM H CHAN MUSIC STUDIO</h1>

<div class="hero-container">
    <img src="JP.jpg" alt="Jimmy Page" class="hero-image">

    <!-- UPDATED CTA BUTTON -->
    <a id="installButton" onclick="showInstallOverlay()" class="floating-cta">
        <img src="icon-download-cta.jpg" alt="Install App">
        <span class="cta-label">INSTALL APP</span>
    </a>
</div>

<div class="grid">
    <a href="chinese-men.html" class="box">Chinese Men<span>Solo Songs</span></a>
    <a href="chinese-lady.html" class="box">Chinese Lady<span>Solo Songs</span></a>
    <a href="chinese-duet.html" class="box">Chinese Duet<span>Chorus</span></a>
    <a href="english.html" class="box">English Songs<span>Classics</span></a>
</div>

<footer style="margin-top: 40px; color: #444; font-size: 12px;">
    Studio App v1.0 | © 2026 William H Chan
</footer>

<!-- ⭐ INSTALL MODAL (Centered) -->
<div id="installModal" style="
    display:none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 9999;
    justify-content: center;
    align-items: center;
">
    <div style="
        background: #111;
        color: #fff;
        padding: 25px;
        width: 85%;
        max-width: 350px;
        border-radius: 12px;
        text-align: center;
        border: 1px solid #444;
    ">
        <h2 style="margin-top:0; font-size:20px;">Install This App</h2>
        <p style="font-size:14px; line-height:1.5;">
            To install this app on your iPhone:
            <br><br>
            <strong>1.</strong> Tap the <strong>Share</strong> icon  
            <br>
            <strong>2.</strong> Choose <strong>Add to Home Screen</strong>  
            <br>
            <strong>3.</strong> Tap <strong>Add</strong>
        </p>

        <button onclick="closeInstallModal()" style="
            margin-top: 15px;
            padding: 10px 20px;
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        ">OK</button>
    </div>
</div>

<!-- ⭐ INSTALL MODAL SCRIPT -->
<script>
function showInstallOverlay() {
    document.getElementById('installModal').style.display = 'flex';
}

function closeInstallModal() {
    document.getElementById('installModal').style.display = 'none';
}

// Auto-hide Install button if already installed
window.addEventListener('DOMContentLoaded', () => {
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                      || window.navigator.standalone === true;

    if (isStandalone) {
        const cta = document.getElementById('installButton');
        if (cta) cta.style.display = 'none';
    }
});
</script>

</body>
</html>
