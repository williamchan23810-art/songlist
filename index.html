<!DOCTYPE html>
<html>
<head>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .hero-container {
            position: relative;
            display: inline-block;
            border: 1px solid #333; /* Shows you the box even if image is missing */
            min-width: 300px;
            min-height: 200px;
        }

        .hero-image {
            display: block;
            width: 100%;
            max-width: 1000px;
            height: auto;
        }

        /* Positioning your Download Icon */
        .floating-cta {
            position: absolute;
            right: 10%; /* Adjust this to move it left/right */
            top: 50%;   /* Adjust this to move it up/down */
            transform: translateY(-50%);
            text-decoration: none;
            z-index: 100;
        }

        .floating-cta img {
            width: 100px;
            height: auto;
            transition: 0.3s;
        }

        .floating-cta img:hover {
            transform: scale(1.1);
        }

        .cta-label {
            display: block;
            background: #2196F3; /* Bright blue for visibility */
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <h1>William H Chan Music Studio</h1>

        <div class="hero-container">
            <img src="jimmy-page.jpg" alt="" class="hero-image">

            <a href="download.html" class="floating-cta">
                <img src="icon-download-cta.jpg" alt="Download Icon">
                <span class="cta-label">DOWNLOAD APP</span>
            </a>
        </div>
    </div>

</body>
</html>
