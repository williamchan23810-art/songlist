<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>William H Chan Music Studio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 40px; font-size: 2.5rem; color: #f1c40f; }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 80%;
            max-width: 1000px;
        }
        .btn {
            padding: 40px;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            color: white;
            border-radius: 15px;
            transition: transform 0.3s, background-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn:hover { transform: scale(1.05); }
        
        /* Button Colors */
        .btn-english { background-color: #2980b9; } /* Blue */
        .btn-men { background-color: #27ae60; }     /* Green */
        .btn-lady { background-color: #d81b60; }    /* Pink/Magenta */
        
    </style>
</head>
<body>

    <h1>William H Chan Music Studio 安清</h1>

    <div class="container">
        <a href="english.html" class="btn btn-english">English Songlist</a>

        <a href="chinese-men.html" class="btn btn-men">Chinese Men Songlist</a>

        <a href="chinese-lady.html" class="btn btn-lady">Chinese Lady Songlist</a>
    </div>

</body>
</html>
