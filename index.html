<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>William H Chan Music Studio</title>
    <style>
        /* General Page Styling */
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
            padding: 40px 15px;
        }

        h1 { margin-bottom: 20px; font-weight: 300; letter-spacing: 2px; }

        /* 1. HERO SECTION (Jimmy Page + Download Icon) */
        .hero-container {
            position: relative;
            display: inline-block;
            max-width: 900px;
            margin-bottom: 30px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
        }

        .hero-image {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #333;
        }

        /* The Clickable Download Icon Positioning */
        .floating-cta {
            position: absolute;
            right: 5%;      /* Aligned to the right side of the photo */
            top: 50%;       /* Vertically centered */
            transform: translateY(-50%);
            z-index: 100;
            text-decoration: none;
            text-align: center;
        }

        .floating-cta img {
            width: 100px;    /* Size of your record icon */
            height: auto;
            transition: transform 0.3s ease;
            filter: drop-shadow(0px 4px 15px rgba(0,0,0,0.8));
        }

        .floating-cta img:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .cta-label {
            display: block;
            background: #ffcc00; /* Gold color */
            color: #000;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 10px;
            font-size: 13px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        }
