<!DOCTYPE html>
<html>
<head>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; text-align: center; }
        
        .hero-container {
            position: relative;
            display: inline-block;
            margin-top: 50px;
        }

        .hero-image {
            width: 100%;
            max-width: 900px;
            height: auto;
            border: 2px solid #444;
        }

        .floating-cta {
            position: absolute;
            right: 5%;
            top: 50%;
            transform: translateY(-50%);
            text-decoration: none;
        }

        .floating-cta img {
            width: 120px; /* Made it larger so you can't miss it */
            height: auto;
            display: block;
        }

        .cta-label {
            display: block;
            background: gold;
            color: black;
            padding: 5px;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h1>William H Chan Music Studio</h1>

    <div class="hero-container">
        <img src="jimmy-page.jpg" alt="Jimmy Page Background" class="hero-image">

        <a href="download.html" class="floating-cta">
            <img src="icon-download-cta.jpg" alt="Click to Download">
            <span class="cta-label">DOWNLOAD APP</span>
        </a>
    </div>

</body>
</html>
