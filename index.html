<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.jpg">
    <link rel="apple-touch-icon-precomposed" href="icon-192.jpg">
    <link rel="icon" type="image/jpeg" href="icon-192.jpg">

    <title>William H Chan Music Studio</title>
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            position: relative;
            overflow-x: hidden;
        }

        /* The Background Layer - Jimmy Page Sepia 40% */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('JP.jpg'); 
            background-size: cover;
            background-position: center;
            filter: sepia(100%) hue-rotate(-20deg) brightness(1.1); 
            opacity: 0.4; 
            z-index: -1; 
            pointer-events: none;
        }

        /* Fully Transparent Container */
        .container { 
            text-align: center; 
            background: transparent; 
            padding: 30px; 
            width: 90%; 
            max-width: 400px; 
            z-index: 1;
        }

        h1 { 
            color: #ffffff; 
            margin-bottom: 25px; 
            font-size: 1.6rem; 
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); 
        }
        
        .menu-btn {
            display: block;
            width: 100%;
            padding: 15px 0;
            margin: 12px 0;
            text-decoration: none;
            color: white; 
            font-weight: bold;
            border-radius: 8px;
            transition: transform 0.2s, filter 0.2s;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            -webkit-tap-highlight-color: transparent;
        }

        .menu-btn:hover { filter: brightness(1.1); }
        .menu-btn:active { transform: scale(0.97); }

        /* Studio Color Coding */
        .btn-lady { background-color: #d81b60; } 
        .btn-men  { background-color: #27ae60; } 
        .btn-duet { background-color: #8e44ad; } 
        .btn-eng  { background-color: #2980b9; } 

        .footer { 
            margin-top: 30px; 
            font-size: 0.8rem; 
            color: #ffffff; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        /* Install Instruction Styling */
        #install-prompt {
            display: none; 
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(0,0,0,0.9); 
            color: white; 
            padding: 18px; 
            border-radius: 15px; 
            z-index: 999; 
            width: 85%;
