    <title>William H Chan Music Studio</title>

    <meta property="og:title" content="William H Chan Music Studio">
    <meta property="og:description" content="Explore our Studio Song Library and Karaoke List.">
    <meta property="og:image" content="https://williamchan23810-art.github.io/songlist/turntable-Icon.jpg">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        :root { 
            --primary: #e63946; 
            --secondary: #457b9d; 
            --bg: #f8f9fa; 
            --text: #1d3557; 
        }

        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 10px; /* Reduced body padding */
        }

        /* --- CONDENSED SPINNING LOGO --- */
        @keyframes slowSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .logo { 
            width: 70px; /* Reduced from 90px */
            height: 70px; 
            object-fit: cover; 
            border-radius: 50%; 
            border: 2px solid #333; 
            margin-bottom: 5px; /* Reduced from 15px */
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            animation: slowSpin 5s linear infinite; 
        }

        .logo:hover {
            animation-play-state: paused;
            cursor: pointer;
        }

        header { 
            text-align: center; 
            margin-bottom: 15px; /* Reduced from 30px */
            border-bottom: 2px solid var(--secondary); 
            padding-bottom: 10px; /* Reduced from 20px */
        }

        header h1 { font-size: 1.5rem; margin: 5px 0; } /* Smaller title */
        header p { font-size: 0.9rem; margin-top: 0; }

        /* --- SEARCH BOX --- */
        #search-box { 
            width: 100%; 
            padding: 12px; /* Thinner box */
            font-size: 16px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            margin-bottom: 15px; /* Reduced from 25px */
            box-sizing: border-box; 
            outline: none;
        }

        /* --- CONDENSED SONG CARDS --- */
        .song-card { 
            background: white; 
            margin-bottom: 6px; /* 50% less gap between songs */
            padding: 10px 15px; /* Thinner padding */
            border-radius: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 1px 4px rgba(0,0,0,0.05); 
        }

        .details { flex: 1; margin-right: 10px; }
        .artist { font-size: 0.75rem; font-weight: bold; color: var(--secondary); text-transform: uppercase; display: block; }
        .song-name { font-size: 1rem; font-weight: 600; color: #333; }

        .actions { display: flex; gap: 8px; }
        .btn { 
            text-decoration: none; 
            padding: 6px 12px; /* Smaller buttons */
            border-radius: 6px; 
            font-size: 12px; 
            font-weight: bold; 
            color: white; 
            text-align: center;
            min-width: 75px;
        }
        .btn-orig { background-color: #3498db; }
        .btn-kara { background-color: #e63946; }

        /* --- COMPACT SPOTIFY PLAYER --- */
        .spotify-container {
            margin-top: 25px; /* Reduced from 50px */
            padding: 10px;
            background: #ffffff;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        @media (max-width: 600px) {
            .song-card { flex-direction: row; align-items: center; } /* Keeps it clean on mobile */
            .btn { min-width: 65px; padding: 5px 8px; }
        }
    </style>
</head>
