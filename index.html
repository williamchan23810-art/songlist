<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 50px;
        }

        .hero-container {
            position: relative;
            display: inline-block;
            background-color: #111;
        }

        .hero-image {
            display: block;
            width: 100%;
            max-width: 900px;
            height: auto;
            border: 1px solid #333;
        }

        /* This is your clickable record icon area */
        .floating-cta {
            position: absolute;
            right: 5%;      /* Moves it to the right side of Jimmy Page */
            top: 50%;       /* Middle of the image vertically */
            transform: translateY(-50%);
            z-index: 100;
            text-decoration: none;
        }

        .floating-cta img {
            width: 100px;    /* Size of your record icon */
            height: auto;
            transition: transform 0.3s ease;
            filter: drop-shadow(0px 0px 10px rgba(0,0,0,0.8));
        }

        .floating-cta img:hover {
            transform: scale(1.1);
        }

        .cta-label {
            display: block;
            background: #ffcc00;
            color: #000;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            margin-top: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>William H Chan Music Studio</h1>

    <div class="hero-container">
        <img src="JP.jpg" alt="Jimmy Page" class="hero-image">

        <a href="download.html" class="floating-cta">
            <img src="icon-download-cta.jpg" alt="Download">
            <span class="cta-label">DOWNLOAD APP</span>
        </a>
    </div>

</body>
</html>
