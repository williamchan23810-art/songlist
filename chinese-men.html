<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>男聲歌曲庫 (Double Column)</title>
    <style>
        body { background-color: #000; color: #ddd; font-family: sans-serif; padding: 10px; margin: 0; font-size: 12px; }
        h1 { color: #ff4500; font-size: 18px; margin: 0 0 5px 0; }
        #count { font-size: 11px; color: #666; margin-bottom: 10px; display: block; }
        
        #search { 
            width: 100%; padding: 8px; margin-bottom: 15px; 
            background: #111; border: 1px solid #333; color: #fff; border-radius: 4px;
        }

        /* Main Container: 2 Main Columns */
        #grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Two equal main columns */
            column-gap: 15px; /* Space between the two main lists */
        }

        /* Individual Song Row Grid */
        .song-item {
            display: grid;
            /* Artist | Song Title | O | K */
            grid-template-columns: auto 1fr 22px 22px;
            gap: 4px;
            align-items: center;
            padding: 4px 0;
            border-bottom: 1px solid #222;
        }

        .artist { color: #fff; font-weight: bold; padding-right: 5px; white-space: nowrap; }
        .song { color: #999; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Tiny Link Buttons */
        .btn {
            display: inline-block;
            width: 18px;
            height: 18px;
            line-height: 18px;
            text-align: center;
            text-decoration: none;
            font-size: 10px;
            font-weight: bold;
            border-radius: 2px;
        }
        .btn-o { background: #333; color: #aaa; } /* Original */
        .btn-k { background: #ff4500; color: #fff; } /* Karaoke */
        .btn:hover { opacity: 0.8; transform: scale(1.1); }
        .no-link { width: 18px; display: inline-block; }

        /* Responsive: Stack back to 1 column on very small phones */
        @media (max-width: 600px) {
            #grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <h1>男聲歌曲庫</h1>
    <span id="count">Loading...</span>
    
    <input type="text" id="search" placeholder="Search..." onkeyup="filterSongs()">

    <div id="grid-container">
        </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSeK0hJoqyYLa5BQLl42QIAHMlbT_0tAa0FxhoBBebSUqV98bwac7ACwQc1y2yA6SLOd1nGvJYD-zLB/pub?gid=0&single=true&output=csv';
        let songData = [];

        async function loadSongs() {
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                const rows = csvText.split(/\r?\n/).filter(row => row.trim() !== "");
                
                songData = rows.slice(1).map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
                    return {
                        artist: cols[0]?.replace(/"/g, '').trim() || '',
                        song: cols[1]?.replace(/"/g, '').trim() || '',
                        orig: cols[2]?.replace(/"/g, '').trim() || '',
                        kara: cols[3]?.replace(/"/g, '').trim() || ''
                    };
                }).filter(s => s.artist || s.song);

                document.getElementById('count').innerText = `${songData.length} Songs`;
                displaySongs(songData);
            } catch (err) {
                document.getElementById('grid-container').innerHTML = "Error loading list.";
            }
        }

        function displaySongs(songs) {
            const container = document.getElementById('grid-container');
            container.innerHTML = songs.map(s => `
                <div class="song-item">
                    <span class="artist">${s.artist}</span>
                    <span class="song">${s.song}</span>
                    ${s.orig ? `<a href="${s.orig}" class="btn btn-o" target="_blank" title="Original">O</a>` : '<span class="no-link"></span>'}
                    ${s.kara ? `<a href="${s.kara}" class="btn btn-k" target="_blank" title="Karaoke">K</a>` : '<span class="no-link"></span>'}
                </div>
            `).join('');
        }

        function filterSongs() {
            const term = document.getElementById('search').value.toLowerCase();
            const filtered = songData.filter(s => 
                s.artist.toLowerCase().includes(term) || 
                s.song.toLowerCase().includes(term)
            );
            displaySongs(filtered);
        }

        loadSongs();
    </script>
</body>
</html>
