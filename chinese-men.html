<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>男聲歌曲庫 (Men's List)</title>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; }
        h1 { color: #ff4500; font-size: 28px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        
        #search { 
            width: 100%; padding: 12px; margin: 20px 0; 
            background: #111; border: 1px solid #444; color: #fff; border-radius: 8px;
            font-size: 16px;
        }

        .container { display: flex; flex-direction: column; gap: 12px; }
        
        .card { 
            background: #1a1a1a; border: 1px solid #333; padding: 15px; 
            border-radius: 10px; transition: transform 0.2s;
        }
        .card:hover { border-color: #ff4500; transform: translateY(-2px); }

        .initial { color: #ff4500; font-weight: bold; font-size: 13px; text-transform: uppercase; margin-bottom: 4px; }
        .artist { font-size: 19px; font-weight: 600; display: block; margin-bottom: 8px; }
        
        .link-btn {
            display: inline-block; padding: 6px 12px; background: #333; color: #eee;
            text-decoration: none; border-radius: 4px; font-size: 14px;
        }
        .link-btn:hover { background: #ff4500; color: #fff; }

        .loading { color: #888; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>

    <h1>男聲歌曲庫 (Men's List)</h1>
    
    <input type="text" id="search" placeholder="Search by Artist, Song, or Initial (e.g. CCT)..." onkeyup="filterSongs()">

    <div id="song-list" class="container">
        <div class="loading">Fetching data from Google Sheets...</div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSeK0hJoqyYLa5BQLl42QIAHMlbT_0tAa0FxhoBBebSUqV98bwac7ACwQc1y2yA6SLOd1nGvJYD-zLB/pub?gid=0&single=true&output=csv';
        let songData = [];

        async function loadSongs() {
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                
                // Parse CSV lines
                const rows = csvText.split('\n').slice(1); // Remove header row
                
                songData = rows.map(row => {
                    const cols = row.split(',');
                    return {
                        initial: cols[0]?.trim(),
                        artist: cols[1]?.trim(),
                        link: cols[2]?.trim()
                    };
                }).filter(s => s.artist); // Only keep rows with names

                displaySongs(songData);
            } catch (err) {
                document.getElementById('song-list').innerHTML = "Error loading data. Check if the Sheet is published to web.";
            }
        }

        function displaySongs(songs) {
            const list = document.getElementById('song-list');
            list.innerHTML = songs.map(s => `
                <div class="card">
                    <div class="initial">${s.initial || 'N/A'}</div>
                    <span class="artist">${s.artist}</span>
                    <a href="${s.link}" class="link-btn" target="_blank">View Karaoke Link</a>
                </div>
            `).join('');
        }

        function filterSongs() {
            const term = document.getElementById('search').value.toLowerCase();
            const filtered = songData.filter(s => 
                s.artist.toLowerCase().includes(term) || 
                (s.initial && s.initial.toLowerCase().includes(term))
            );
            displaySongs(filtered);
        }

        loadSongs();
    </script>
</body>
</html>
