<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>男聲歌曲庫 (Double Column)</title>
    <style>
        body { background-color: #000; color: #ccc; font-family: -apple-system, sans-serif; padding: 15px; margin: 0; font-size: 13px; }
        h1 { color: #ff4500; font-size: 22px; margin: 0 0 5px 0; }
        #status { font-size: 12px; color: #666; display: block; margin-bottom: 12px; }
        
        #search { 
            width: 100%; padding: 10px; margin-bottom: 20px; 
            background: #111; border: 1px solid #333; color: #fff; border-radius: 6px;
        }

        /* The Magic: CSS Column-Count */
        #song-list {
            column-count: 2;
            column-gap: 40px;
            /* This creates your 30px center double line spacing naturally */
            column-rule: 3px double #444; 
        }

        /* Song Row Styling */
        .song-item {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #1a1a1a;
            padding: 5px 0;
            break-inside: avoid; /* Prevents a song from splitting between columns */
            overflow: hidden;
        }

        .artist { color: #fff; font-weight: bold; margin-right: 8px; flex-shrink: 0; }
        
        /* The song title - limited width to keep links close */
        .song { color: #888; margin-right: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }

        .link-group { display: flex; gap: 4px; flex-shrink: 0; }

        .btn {
            width: 18px; height: 18px; line-height: 18px; text-align: center;
            text-decoration: none; font-size: 10px; font-weight: bold;
            border-radius: 3px;
        }
        .btn-o { background: #333; color: #aaa; } 
        .btn-k { background: #ff4500; color: #fff; }
        .btn:hover { background: #fff; color: #000; }

        /* Mobile Adjustments */
        @media (max-width: 800px) {
            #song-list { column-count: 1; column-rule: none; }
            .song { max-width: none; }
        }
    </style>
</head>
