<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>男聲歌曲庫 (Grid Layout)</title>
    <style>
        body { background-color: #000; color: #ddd; font-family: sans-serif; padding: 15px; margin: 0; font-size: 14px; }
        h1 { color: #ff4500; font-size: 20px; margin-bottom: 5px; }
        #count { font-size: 12px; color: #666; margin-bottom: 15px; display: block; }
        
        #search { 
            width: 100%; padding: 10px; margin-bottom: 20px; 
            background: #111; border: 1px solid #333; color: #fff; border-radius: 5px;
        }

        /* The Grid Header & Rows */
        .song-grid {
            display: grid;
            /* Column A: Auto (Artist), Column B: 1fr (Song), Column C: 80px (Orig), Column D: 80px (Kara) */
            grid-template-columns: minmax(100px, auto) 1fr 70px 70px;
            gap: 1px;
            background-color: #333; /* This creates the thin lines between cells */
            border: 1px solid #333;
        }

        .grid-header {
            background-color: #1a1a1a;
            color: #ff4500;
            font-weight: bold;
            font-size: 11px;
            text-transform: uppercase;
            padding: 8px;
        }

        .grid-cell {
            background-color: #000;
            padding: 8px;
            display: flex;
            align-items: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Styling for specific data types */
        .artist-name { color: #fff; font-weight: 600; }
        .song-title { color: #bbb; }

        .btn {
            text-decoration: none;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 0;
            width: 100%;
            text-align: center;
            border-radius: 3px;
            transition: 0.2s;
        }
        .btn-orig { color: #888; border: 1px solid #444; }
        .btn-kara { color: #ff4500; border: 1px solid #ff4500; }
        .btn:hover { background: #ff4500; color: #fff !important; }

        /* Hover effect for the whole row */
        .song-grid:hover .grid-cell { background-color: #0a0a0a; }
    </style>
</head>
<body>

    <h1>男聲歌曲庫</h1>
    <span id="count">Connecting to Google Sheets...</span>
    
    <input type="text" id="search" placeholder="Search by Artist or Song..." onkeyup="filterSongs()">

    <div class="song-grid">
        <div class="grid-header">Artist</div>
        <div class="grid-header">Song Title</div>
        <div class="grid-header">Original</div>
        <div class="grid-header">Karaoke</div>
    </div>
    <div id="grid-body" class="song-grid" style="border-top: none;">
        </div>

    <script>
