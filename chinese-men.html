<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>男聲歌曲庫 (Compact List)</title>
    <style>
        body { background-color: #000; color: #ddd; font-family: sans-serif; padding: 10px; margin: 0; font-size: 13px; }
        h1 { color: #ff4500; font-size: 18px; margin: 0; display: inline-block; }
        #count { font-size: 11px; color: #666; margin-left: 10px; }
        
        #search { 
            width: 100%; padding: 8px; margin: 10px 0; 
            background: #111; border: 1px solid #333; color: #fff; border-radius: 4px;
            box-sizing: border-box;
        }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { text-align: left; color: #ff4500; border-bottom: 1px solid #444; padding: 6px 4px; font-size: 11px; }
        td { padding: 5px 4px; border-bottom: 1px solid #222; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        /* Column Widths */
        .col-artist { width: 25%; color: #fff; font-weight: bold; }
        .col-song { width: 40%; color: #bbb; }
        .col-links { width: 35%; text-align: right; }

        .btn { 
            display: inline-block; text-decoration: none; padding: 2px 5px; 
            border-radius: 3px; font-size: 10px; font-weight: bold; margin-left: 3px;
        }
        .btn-orig { border: 1px solid #555; color: #aaa; }
        .btn-kara { border: 1px solid #ff4500; color: #ff4500; }
        .btn:hover { background: #ff4500; color: #fff; border-color: #ff4500; }
        tr:hover td { background-color: #111; }
    </style>
</head>
<body>

    <h1>男聲歌曲庫</h1><span id="count">Syncing...</span>
    <input type="text" id="search" placeholder="Search Artist or Song Name..." onkeyup="filterSongs()">

    <table>
        <thead>
            <tr>
                <th class="col-artist">Artist</th>
                <th class="col-song">Song Title</th>
                <th class="col-links">Links</th>
            </tr>
        </thead>
        <tbody id="song-table-body">
            </tbody>
    </table>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSeK0hJoqyYLa5BQLl42QIAHMlbT_0tAa0FxhoBBebSUqV98bwac7ACwQc1y2yA6SLOd1nGvJYD-zLB/pub?gid=0&single=true&output=csv';
        let songData = [];

        async function loadSongs() {
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                const rows = csvText.split(/\r?\n/).filter(row => row.trim() !== "");
                
                // Mapping the 4 columns: A(Artist), B(Song), C(Original Link), D(Karaoke Link)
                songData = rows.slice(1).map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
                    return {
                        artist: cols[0]?.replace(/"/g, '').trim() || '',
                        song: cols[1]?.replace(/"/g, '').trim() || '',
                        origLink: cols[2]?.replace(/"/g, '').trim() || '',
                        karaLink: cols[3]?.replace(/"/g, '').trim() || ''
                    };
                }).filter(s => s.artist || s.song); 

                document.getElementById('count').innerText = `(${songData.length} items)`;
                displaySongs(songData);
            } catch (err) {
                document.getElementById('song-table-body').innerHTML = "<tr><td colspan='3'>Error loading data.</td></tr>";
            }
        }

        function displaySongs(songs) {
            const body = document.getElementById('song-table-body');
            body.innerHTML = songs.map(s => `
                <tr>
                    <td class="col-artist">${s.artist}</td>
                    <td class="col-song">${s.song}</td>
                    <td class="col-links">
                        ${s.origLink ? `<a href="${s.origLink}" class="btn btn-orig" target="_blank">ORIG</a>` : ''}
                        ${s.karaLink ? `<a href="${s.karaLink}" class="btn btn-kara" target="_blank">KARA</a>` : ''}
                    </td>
                </tr>
            `).join('');
        }

        function filterSongs() {
            const term = document.getElementById('search').value.toLowerCase();
            const filtered = songData.filter(s => 
                s.artist.toLowerCase().includes(term) || 
                s.song.toLowerCase().includes(term)
            );
            displaySongs(filtered);
        }

        loadSongs();
    </script>
</body>
</html>
