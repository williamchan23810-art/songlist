<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>男聲歌曲庫 (Full 4-Column)</title>
    <style>
        body { background-color: #000; color: #ddd; font-family: sans-serif; padding: 10px; margin: 0; font-size: 13px; }
        h1 { color: #ff4500; font-size: 18px; margin: 0; display: inline-block; }
        #count { font-size: 11px; color: #666; margin-left: 10px; }
        
        #search { 
            width: 100%; padding: 8px; margin: 10px 0; 
            background: #111; border: 1px solid #333; color: #fff; border-radius: 4px;
            box-sizing: border-box;
        }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { text-align: left; color: #ff4500; border-bottom: 1px solid #444; padding: 6px 4px; font-size: 11px; }
        td { padding: 6px 4px; border-bottom: 1px solid #222; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        /* Specific Widths for 4 Columns */
        .col-a { width: 22%; color: #fff; font-weight: bold; } /* Artist */
        .col-b { width: 38%; color: #bbb; }              /* Song Title */
        .col-c { width: 20%; text-align: center; }       /* Original Link */
        .col-d { width: 20%; text-align: center; }       /* Karaoke Link */

        .btn { 
            display: inline-block; text-decoration: none; padding: 3px 8px; 
            border-radius: 3px; font-size: 10px; font-weight: bold; width: 80%;
        }
        .btn-orig { border: 1px solid #555; color: #aaa; }
        .btn-kara { border: 1px solid #ff4500; color: #ff4500; }
        .btn:hover { background: #ff4500; color: #fff !important; border-color: #ff4500; }
        
        tr:hover td { background-color: #111; }
    </style>
</head>
<body>

    <h1>男聲歌曲庫</h1><span id="count">Connecting...</span>
    <input type="text" id="search" placeholder="Search Artist or Song Title..." onkeyup="filterSongs()">

    <table>
        <thead>
            <tr>
                <th class="col-a">Artist</th>
                <th class="col-b">Song Title</th>
                <th class="col-c">Original</th>
                <th class="col-d">Karaoke</th>
            </tr>
        </thead>
        <tbody id="song-table-body">
            </tbody>
    </table>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSeK0hJoqyYLa5BQLl42QIAHMlbT_0tAa0FxhoBBebSUqV98bwac7ACwQc1y2yA6SLOd1nGvJYD-zLB/pub?gid=0&single=true&output=csv';
        let songData = [];

        async function loadSongs() {
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                
                // Splitting by lines and filtering out empty ones
                const rows = csvText.split(/\r?\n/).filter(row => row.trim() !== "");
                
                songData = rows.slice(1).map(row => {
                    // This regex is safer for CSVs that might have commas inside quotes
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
                    return {
                        artist: cols[0]?.replace(/"/g, '').trim() || '',
                        song: cols[1]?.replace(/"/g, '').trim() || '',
                        origLink: cols[2]?.replace(/"/g, '').trim() || '',
                        karaLink: cols[3]?.replace(/"/g, '').trim() || ''
                    };
                }).filter(s => s.artist || s.song); 

                document.getElementById('count').innerText = `(${songData.length} items found)`;
                displaySongs(songData);
            } catch (err) {
                document.getElementById('song-table-body').innerHTML = "<tr><td colspan='4'>Failed to load Column D. Please check if the sheet sharing includes all columns.</td></tr>";
            }
        }

        function displaySongs(songs) {
            const body = document.getElementById('song-table-body');
            body.innerHTML = songs.map(s => `
                <tr>
                    <td class="col-a">${s.artist}</td>
                    <td class="col-b">${s.song}</td>
                    <td class="col-c">
                        ${s.origLink && s.origLink !== '#' ? `<a href="${s.origLink}" class="btn btn-orig" target="_blank">VIEW</a>` : '--'}
                    </td>
                    <td class="col-d">
                        ${s.karaLink && s.karaLink !== '#' ? `<a href="${s.karaLink}" class="btn btn-kara" target="_blank">SING</a>` : '--'}
                    </td>
                </tr>
            `).join('');
        }

        function filterSongs() {
            const term = document.getElementById('search').value.toLowerCase();
            const filtered = songData.filter(s => 
                s.artist.toLowerCase().includes(term) || 
                s.song.toLowerCase().includes(term)
            );
            displaySongs(filtered);
        }

        loadSongs();
    </script>
</body>
</html>
