<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>男聲歌曲庫 (Double Column)</title>
    <style>
        body { background-color: #000; color: #ccc; font-family: -apple-system, sans-serif; padding: 10px; margin: 0; font-size: 12px; }
        h1 { color: #ff4500; font-size: 18px; margin: 0; }
        #count { font-size: 11px; color: #666; display: block; margin-bottom: 8px; }
        
        #search { 
            width: 100%; padding: 6px; margin-bottom: 10px; 
            background: #111; border: 1px solid #333; color: #fff; border-radius: 4px;
        }

        /* Flexbox wrapper to allow two columns side-by-side */
        #main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0 20px; /* 0 vertical gap, 20px horizontal gap between columns */
        }

        /* Each song row takes up roughly 48% of the width */
        .song-item {
            width: calc(50% - 15px);
            display: flex;
            align-items: center;
            border-bottom: 1px solid #222;
            padding: 3px 0;
            white-space: nowrap;
            overflow: hidden;
        }

        .artist { color: #fff; font-weight: bold; margin-right: 6px; flex-shrink: 0; }
        .song { color: #888; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; padding-right: 5px; }

        /* Small Icons */
        .btn {
            width: 16px; height: 16px; line-height: 16px; text-align: center;
            text-decoration: none; font-size: 10px; font-weight: bold;
            border-radius: 2px; margin-left: 3px; flex-shrink: 0;
        }
        .btn-o { background: #333; color: #aaa; } 
        .btn-k { background: #ff4500; color: #fff; }
        .btn:hover { opacity: 0.7; }

        /* Responsive: Single column for phones */
        @media (max-width: 700px) {
            .song-item { width: 100%; }
        }
    </style>
</head>
<body>

    <h1>男聲歌曲庫</h1>
    <span id="count">Status: Connecting...</span>
    
    <input type="text" id="search" placeholder="Search..." oninput="filterSongs()">

    <div id="main-container">
        </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSeK0hJoqyYLa5BQLl42QIAHMlbT_0tAa0FxhoBBebSUqV98bwac7ACwQc1y2yA6SLOd1nGvJYD-zLB/pub?gid=0&single=true&output=csv';
        let songData = [];

        async function loadSongs() {
            const countEl = document.getElementById('count');
            const container = document.getElementById('main-container');

            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error("Fetch failed");
                const csvText = await response.text();
                
                const rows = csvText.split(/\r?\n/).filter(row => row.trim() !== "");
                
                songData = rows.slice(1).map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
                    return {
                        artist: cols[0]?.replace(/"/g, '').trim() || '',
                        song: cols[1]?.replace(/"/g, '').trim() || '',
                        orig: cols[2]?.replace(/"/g, '').trim() || '',
                        kara: cols[3]?.replace(/"/g, '').trim() || ''
                    };
                }).filter(s => s.artist || s.song);

                countEl.innerText = `${songData.length} Songs Loaded`;
                displaySongs(songData);
            } catch (err) {
                countEl.innerText = "Error: Could not load data. Ensure Sheet is Published.";
                console.error(err);
            }
        }

        function displaySongs(songs) {
            const container = document.getElementById('main-container');
            container.innerHTML = songs.map(s => `
                <div class="song-item">
                    <span class="artist">${s.artist}</span>
                    <span class="song">${s.song}</span>
                    ${s.orig ? `<a href="${s.orig}" class="btn btn-o" target="_blank">O</a>` : ''}
                    ${s.kara ? `<a href="${s.kara}" class="btn btn-k" target="_blank">K</a>` : ''}
                </div>
            `).join('');
        }

        function filterSongs() {
            const term = document.getElementById('search').value.toLowerCase();
            const filtered = songData.filter(s => 
                s.artist.toLowerCase().includes(term) || 
                s.song.toLowerCase().includes(term)
            );
            displaySongs(filtered);
        }

        loadSongs();
    </script>
</body>
</html>
