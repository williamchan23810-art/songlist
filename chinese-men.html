<script>
        // Your specific published CSV link
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSeK0hJoqyYLa5BQLl42QIAHMlbT_0tAa0FxhoBBebSUqV98bwac7ACwQc1y2yA6SLOd1nGvJYD-zLB/pub?gid=0&single=true&output=csv';

        async function fetchSongs() {
            try {
                const response = await fetch(sheetUrl);
                const data = await response.text();
                
                // This handles the CSV rows properly even if there are commas in song titles
                const rows = data.split('\n').slice(1); 
                
                const container = document.getElementById('songContainer');
                document.getElementById('loading').style.display = 'none';

                container.innerHTML = rows.map(row => {
                    // Splitting by comma, but being careful with the data
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
                    
                    if (cols.length < 2) return ''; 

                    // MAPPING TO YOUR SHEET COLUMNS:
                    // cols[0] = Artist (A)
                    // cols[1] = Song Title (B)
                    // cols[5] = Language (F)
                    // cols[6] = Music Link (G)
                    // cols[7] = KTV Link (H)
                    
                    const artist = cols[0]?.replace(/"/g, "") || "Unknown";
                    const title = cols[1]?.replace(/"/g, "") || "Unknown";
                    const lang = cols[5]?.replace(/"/g, "") || "國語/廣東話";
                    const musicLink = cols[6]?.replace(/"/g, "").trim();
                    const ktvLink = cols[7]?.replace(/"/g, "").trim();

                    return `
                        <div class="song-row">
                            <div class="song-info">
                                <span class="artist">${artist}</span>
                                <span class="title">${title}</span>
                            </div>
                            <span class="lang-badge">${lang}</span>
                            <div class="actions">
                                ${musicLink ? `<a href="${musicLink}" target="_blank" class="btn btn-orig">MUSIC</a>` : ''}
                                ${ktvLink ? `<a href="${ktvLink}" target="_blank" class="btn btn-ktv">KTV</a>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error(error);
                document.getElementById('loading').innerHTML = "Error syncing data. Please refresh.";
            }
        }

        function filterSongs() {
            let input = document.getElementById("searchInput").value.toUpperCase();
            let rows = document.getElementsByClassName("song-row");
            for (let i = 0; i < rows.length; i++) {
                let text = rows[i].textContent.toUpperCase();
                rows[i].style.display = text.includes(input) ? "" : "none";
            }
        }

        fetchSongs();
    </script>
</body>
</html>
