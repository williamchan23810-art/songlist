<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Men's List | The Sound Capsule</title>
    <style>
        body { background: #0f0f0f; color: white; font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        h2 { color: #ff4b2b; text-align: center; }
        #searchInput { width: 100%; padding: 15px; margin: 20px 0; border-radius: 10px; border: 1px solid #333; background: #1a1a1a; color: white; box-sizing: border-box; }
        .song-row { background: #1a1a1a; padding: 15px; margin-bottom: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
        .artist { color: #ff4b2b; font-weight: bold; font-size: 0.85em; display: block; margin-bottom: 4px; }
        .title { font-size: 1.1em; font-weight: 500; }
        .actions { display: flex; gap: 10px; }
        .btn { text-decoration: none; padding: 8px 15px; border-radius: 6px; font-size: 0.8em; font-weight: bold; transition: 0.2s; }
        .btn-ktv { background: #ff4b2b; color: white; }
        .btn-music { background: #333; color: #ccc; }
        #status { text-align: center; color: #888; margin-top: 20px; }
    </style>
</head>
<body>

    <a href="index.html" style="color: #64b5f6; text-decoration: none;">← Back to Menu</a>
    <h2>男聲歌曲庫 (Men's List)</h2>
    
    <input type="text" id="searchInput" onkeyup="filter()" placeholder="搜尋歌手或歌名... Search Artist or Song">
    
    <div id="status">Syncing with Google Sheets...</div>
    <div id="songContainer"></div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSeK0hJoqyYLa5BQLl42QIAHMlbT_0tAa0FxhoBBebSUqV98bwac7ACwQc1y2yA6SLOd1nGvJYD-zLB/pub?gid=0&single=true&output=csv';

        async function fetchSongs() {
            const container = document.getElementById('songContainer');
            const status = document.getElementById('status');

            try {
                const res = await fetch(sheetUrl);
                const csvText = await res.text();
                
                // Split rows and filter out empty ones
                const rows = csvText.split('\n').filter(row => row.trim() !== '');
                
                // Remove header row
                const dataRows = rows.slice(1);
                
                let html = '';

                dataRows.forEach(row => {
                    // Simple split by comma
                    const cols = row.split(',');
                    
                    if (cols.length >= 2) {
                        const artist = cols[0].replace(/"/g, "").trim();
                        const title = cols[1].replace(/"/g, "").trim();
                        const musicLink = cols[6] ? cols[6].replace(/"/g, "").trim() : "";
                        const ktvLink = cols[7] ? cols[7].replace(/"/g, "").trim() : "";

                        html += `
                            <div class="song-row">
                                <div>
                                    <span class="artist">${artist}</span>
                                    <span class="title">${title}</span>
                                </div>
                                <div class="actions">
                                    ${musicLink ? `<a href="${musicLink}" target="_blank" class="btn btn-music">MUSIC</a>` : ''}
                                    ${ktvLink ? `<a href="${ktvLink}" target="_blank" class="btn btn-ktv">KTV</a>` : ''}
                                </div>
                            </div>`;
                    }
                });

                status.style.display = 'none';
                container.innerHTML = html;

            } catch (err) {
                console.error(err);
                status.innerHTML = "⚠️ Error: Make sure your Google Sheet is 'Published to Web' as a CSV.";
            }
        }

        function filter() {
            let input = document.getElementById("searchInput").value.toUpperCase();
            let rows = document.getElementsByClassName("song-row");
            for (let row of rows) {
                row.style.display = row.innerText.toUpperCase().includes(input) ? "" : "none";
            }
        }

        fetchSongs();
    </script>
</body>
</html>
