<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Men Songlist - William H Chan Music Studio</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; margin: 0; }
        h1 { text-align: center; color: #27ae60; margin-top: 20px; } /* Green for Men's page */
        .search-container { text-align: center; margin-bottom: 20px; }
        input[type="text"] { padding: 12px; width: 80%; max-width: 500px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        
        /* Table Styling */
        .table-wrapper { overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; white-space: nowrap; }
        th { background-color: #27ae60; color: white; }
        tr:hover { background-color: #f9f9f9; }

        /* Button Styling */
        .link-btn {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none !important;
            color: white !important;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            min-width: 110px;
        }
        .btn-orig { background-color: #e74c3c; } /* Red */
        .btn-kara { background-color: #3498db; } /* Blue */

        .back-btn { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #27ae60; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Back to Home</a>
    <h1>Chinese Men Songlist</h1>

    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search Song or Artist...">
    </div>

    <div class="table-wrapper">
        <table id="songTable">
            <thead>
                <tr id="tableHeader"></tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSeK0hJoqyYLa5BQLl42QIAHMlbT_0tAa0FxhoBBebSUqV98bwac7ACwQc1y2yA6SLOd1nGvJYD-zLB/pub?gid=0&single=true&output=csv';

        async function loadData() {
            try {
                const response = await fetch(sheetUrl);
                const csvData = await response.text();
                
                const rows = csvData.split(/\r?\n/);
                if (rows.length === 0) return;

                // Create Headers
                const headers = rows[0].split(',').map(h => h.replace(/"/g, '').trim());
                const headerRow = document.getElementById('tableHeader');
                headers.forEach(headerText => {
                    const th = document.createElement('th');
                    th.innerText = headerText;
                    headerRow.appendChild(th);
                });

                // Create Rows
                const tableBody = document.getElementById('tableBody');
                for (let i = 1; i < rows.length; i++) {
                    const columns = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (columns.join('').trim() === "") continue;

                    const tr = document.createElement('tr');
                    columns.forEach((cell, index) => {
                        const td = document.createElement('td');
                        let cleanCell = cell.replace(/"/g, '').trim();

                        if (cleanCell.toLowerCase().startsWith('http')) {
                            const btn = document.createElement('a');
                            btn.href = cleanCell;
                            btn.target = "_blank";
                            btn.className = 'link-btn';

                            const currentHeader = headers[index].toLowerCase();
                            if (currentHeader.includes("original")) {
                                btn.innerText = "Original Song";
                                btn.classList.add('btn-orig');
                            } else {
                                btn.innerText = "Karaoke";
                                btn.classList.add('btn-kara');
                            }
                            td.appendChild(btn);
                        } else {
                            td.innerText = cleanCell;
                        }
                        tr.appendChild(td);
                    });
                    tableBody.appendChild(tr);
                }
            } catch (error) {
                console.error("Error loading data:", error);
            }
        }

        function filterTable() {
            let input = document.getElementById("searchInput").value.toUpperCase();
            let rows = document.getElementById("tableBody").getElementsByTagName("tr");
            for (let i = 0; i < rows.length; i++) {
                let text = rows[i].innerText.toUpperCase();
                rows[i].style.display = text.includes(input) ? "" : "none";
            }
        }

        loadData();
    </script>

</body>
</html>
