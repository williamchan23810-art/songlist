<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>男聲歌曲庫 (Double Column + Divider)</title>
    <style>
        body { background-color: #000; color: #ccc; font-family: -apple-system, sans-serif; padding: 10px; margin: 0; font-size: 13px; }
        h1 { color: #ff4500; font-size: 20px; margin: 0; }
        #count { font-size: 11px; color: #666; display: block; margin-bottom: 8px; }
        
        #search { 
            width: 100%; padding: 8px; margin-bottom: 12px; 
            background: #111; border: 1px solid #333; color: #fff; border-radius: 4px;
        }

        /* The Main Container with a Double Center Line */
        #main-container {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Two equal columns */
            column-gap: 30px; /* Space for the divider */
            position: relative;
        }

        /* The vertical double line divider */
        #main-container::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            border-left: 3px double #444; /* The Double Line */
            transform: translateX(-50%);
        }

        /* Song Row Styling */
        .song-item {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #1a1a1a;
            padding: 4px 0;
            overflow: hidden;
        }

        .artist { color: #fff; font-weight: bold; margin-right: 8px; flex-shrink: 0; }
        
        /* Song title is flexible but stays close to the artist */
        .song { color: #888; margin-right: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Links sit immediately after the title */
        .link-group { display: flex; gap: 3px; flex-shrink: 0; }

        .btn {
            width: 17px; height: 17px; line-height: 17px; text-align: center;
            text-decoration: none; font-size: 10px; font-weight: bold;
            border-radius: 2px;
        }
        .btn-o { background: #333; color: #aaa; } /* Original Link */
        .btn-k { background: #ff4500; color: #fff; } /* Karaoke Link */
        .btn:hover { background: #fff; color: #000; }

        /* Mobile View: Hide the double line and go to 1 column */
        @media (max-width: 800px) {
            #main-container { grid-template-columns: 1fr; }
            #main-container::after { display: none; }
        }
    </style>
</head>
<body>

    <h1>男聲歌曲庫</h1>
    <span id="count">Connecting...</span>
    
    <input type="text" id="search" placeholder="Search Artist or Song..." oninput="filterSongs()">

    <div id="main-container">
        <div id="col-left"></div>
        <div id="col-right"></div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSeK0hJoqyYLa5BQLl42QIAHMlbT_0tAa0FxhoBBebSUqV98bwac7ACwQc1y2yA6SLOd1nGvJYD-zLB/pub?gid=0&single=true&output=csv';
        let songData = [];

        async function loadSongs() {
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                const rows = csvText.split(/\r?\n/).filter(row => row.trim() !== "");
                
                songData = rows.slice(1).map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
                    return {
                        artist: cols[0]?.replace(/"/g, '').trim() || '',
                        song: cols[1]?.replace(/"/g, '').trim() || '',
                        orig: cols[2]?.replace(/"/g, '').trim() || '',
                        kara: cols[3]?.replace(/"/g, '').trim() || ''
                    };
                }).filter(s => s.artist || s.song);

                document.getElementById('count').innerText = `${songData.length} Songs Loaded`;
                displaySongs(songData);
            } catch (err) {
                document.getElementById('count').innerText = "Error loading Google Sheet.";
            }
        }
