<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Men's List | The Sound Capsule</title>
    <style>
        body { background: #0f0f0f; color: white; font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .sticky-header { position: sticky; top: 0; background: #0f0f0f; padding: 10px 0; z-index: 100; border-bottom: 1px solid #333; }
        #searchInput { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: white; box-sizing: border-box; margin: 15px 0; }
        .song-row { background: #1a1a1a; padding: 15px; margin-bottom: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
        .artist-name { color: #ff4b2b; font-weight: bold; font-size: 0.9em; display: block; }
        .song-title { font-size: 1.1em; color: #eee; }
        .btn { text-decoration: none; padding: 8px 15px; border-radius: 6px; font-size: 0.8em; font-weight: bold; background: #ff4b2b; color: white; }
        .btn-music { background: #333; color: #eee; margin-right: 8px; }
        #loading { text-align: center; padding: 40px; color: #666; }
    </style>
</head>
<body>

    <div class="sticky-header" id="top">
        <a href="index.html" style="color: #64b5f6; text-decoration: none;">← Back</a>
        <h2 style="color:#ff4b2b; margin: 5px 0 0 0;">Chinese Men's Songs</h2>
        <input type="text" id="searchInput" onkeyup="filter()" placeholder="Search Artist or Song...">
    </div>

    <div id="loading">Connecting to List...</div>
    <div id="songContainer"></div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSeK0hJoqyYLa5BQLl42QIAHMlbT_0tAa0FxhoBBebSUqV98bwac7ACwQc1y2yA6SLOd1nGvJYD-zLB/pub?gid=0&single=true&output=csv';

        async function fetchSongs() {
            try {
                const res = await fetch(sheetUrl);
                const text = await res.text();
                const lines = text.split(/\r?\n/);
                
                let html = '';
                // Start from i = 1 to skip the "Artist, Song, Initial..." header row
                for (let i = 1; i < lines.length; i++) {
                    const row = lines[i];
                    if (!row.trim()) continue;

                    // Standard comma split
                    const cols = row.split(',');

                    if (cols.length >= 2) {
                        const artist = cols[0].replace(/"/g, "").trim();
                        const title = cols[1].replace(/"/g, "").trim();
                        // Based on your sheet: G is index 6, H is index 7
                        const music = cols[6] ? cols[6].replace(/"/g, "").trim() : "";
                        const ktv = cols[7] ? cols[7].replace(/"/g, "").trim() : "";

                        // Final safety check: don't show the row if there's no artist or title
                        if (artist === "" && title === "") continue;

                        html += `
                            <div class="song-row">
                                <div>
                                    <span class="artist-name">${artist}</span>
                                    <span class="song-title">${title}</span>
                                </div>
                                <div>
                                    ${music.includes('http') ? `<a href="${music}" target="_blank" class="btn btn-music">MUSIC</a>` : ''}
                                    ${ktv.includes('http') ? `<a href="${ktv}" target="_blank" class="btn">KTV</a>` : ''}
                                </div>
                            </div>`;
                    }
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('songContainer').innerHTML = html || "No songs found in the list.";
            } catch (err) {
                document.getElementById('loading').innerHTML = "Sync Error. Please check your internet.";
            }
        }

        function filter() {
            const val = document.getElementById("searchInput").value.toUpperCase();
            const rows = document.getElementsByClassName("song-row");
            for (let row of rows) {
                row.style.display = row.innerText.toUpperCase().includes(val) ? "" : "none";
            }
        }

        fetchSongs();
    </script>
</body>
</html>
