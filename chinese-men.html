<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>男聲歌曲庫 (Compact)</title>
    <style>
        /* Base Styles */
        body { background-color: #000; color: #fff; font-family: -apple-system, sans-serif; padding: 15px; margin: 0; }
        h1 { color: #ff4500; font-size: 20px; margin: 0 0 10px 0; }
        
        /* Compact Search */
        #search { 
            width: 100%; padding: 8px; margin-bottom: 15px; 
            background: #111; border: 1px solid #444; color: #fff; border-radius: 4px;
            box-sizing: border-box;
        }

        /* Multi-column Grid Layout */
        #song-list { 
            display: grid; 
            /* This creates columns that are at least 300px wide and fill the screen */
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 5px 15px; /* Tiny vertical gap, larger horizontal gap */
        }

        /* The Condensed Row (1/4 the original size) */
        .song-row { 
            display: flex; 
            align-items: center; 
            background: #111; 
            border-bottom: 1px solid #222; 
            padding: 4px 8px; /* Very tight padding */
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
        }
        .song-row:hover { background: #222; border-color: #ff4500; }

        .initial { 
            color: #ff4500; font-weight: bold; font-size: 11px; 
            width: 35px; flex-shrink: 0; 
        }
        .artist { 
            flex-grow: 1; font-weight: 500; text-overflow: ellipsis; 
            overflow: hidden; margin-right: 10px;
        }
        
        /* Small Link Icon/Button */
        .link-btn {
            color: #888; text-decoration: none; font-size: 12px;
            padding: 2px 6px; border: 1px solid #444; border-radius: 3px;
        }
        .link-btn:hover { background: #ff4500; color: #fff; border-color: #ff4500; }

        .loading { color: #888; grid-column: 1 / -1; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <h1>男聲歌曲庫 <span id="count" style="font-size: 12px; color: #666;"></span></h1>
    <input type="text" id="search" placeholder="Quick Search..." onkeyup="filterSongs()">

    <div id="song-list">
        <div class="loading">Syncing with Sheets...</div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSeK0hJoqyYLa5BQLl42QIAHMlbT_0tAa0FxhoBBebSUqV98bwac7ACwQc1y2yA6SLOd1nGvJYD-zLB/pub?gid=0&single=true&output=csv';
        let songData = [];

        async function loadSongs() {
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                
                // Advanced split to handle potential commas in names
                const rows = csvText.split(/\r?\n/).filter(row => row.trim() !== "");
                
                songData = rows.slice(1).map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
                    return {
                        initial: cols[0]?.replace(/"/g, '').trim() || '',
                        artist: cols[1]?.replace(/"/g, '').trim() || 'Empty',
                        link: cols[2]?.replace(/"/g, '').trim() || '#'
                    };
                }).filter(s => s.artist !== 'Empty'); 

                document.getElementById('count').innerText = `(${songData.length} songs)`;
                displaySongs(songData);
            } catch (err) {
                document.getElementById('song-list').innerHTML = "Error loading data.";
            }
        }

        function displaySongs(songs) {
            const list = document.getElementById('song-list');
            list.innerHTML = songs.map(s => `
                <div class="song-row">
                    <span class="initial">${s.initial}</span>
                    <span class="artist">${s.artist}</span>
                    <a href="${s.link}" class="link-btn" target="_blank">Play</a>
                </div>
            `).join('');
        }

        function filterSongs() {
            const term = document.getElementById('search').value.toLowerCase();
            const filtered = songData.filter(s => 
                s.artist.toLowerCase().includes(term) || 
                s.initial.toLowerCase().includes(term)
            );
            displaySongs(filtered);
        }

        loadSongs();
    </script>
</body>
</html>
