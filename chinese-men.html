<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>William H Chan Music Studio - Chinese Men</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --primary-men: #2e7d32; --bg: #f8f9fa; --text: #1d3557; }
        body { font-family: -apple-system, sans-serif;  background: rgba(139, 69, 19, 0.75); /* Brown with 75% opacity */; 
              color: var(--text); max-width: 800px; margin: 0 auto; padding: 10px; }
        
        .master-header-container { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; }
        .nav-home { font-size: 32px; text-decoration: none; color: #333; width: 60px; font-weight: bold; }
        @keyframes slowSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .logo-center { width: 80px; height: 80px; object-fit: cover; border-radius: 50%; border: 2px solid #333; animation: slowSpin 5s linear infinite; }
        .qr-static { width: 65px; height: 65px; border: 1px solid #ddd; border-radius: 4px; }
        
        .studio-title { text-align: center; margin-top: 10px; }
        .studio-title h1 { font-family: 'Cambria', serif !important; font-size: 1.5rem; margin: 0; color: #333; }
        .divider { height: 2px; background-color: #457b9d; margin: 15px 0; }

        #search-box { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; outline: none; }
        .song-card { background: white; margin-bottom: 8px; padding: 12px 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .details { flex: 1; margin-right: 10px; }
        .artist { font-size: 0.75rem; font-weight: bold; color: #457b9d; text-transform: uppercase; display: block; }
        .song-name { font-size: 1rem; font-weight: 600; color: #333; }
        .actions { display: flex; gap: 8px; }
        .btn { text-decoration: none; padding: 8px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; color: white; min-width: 65px; text-align: center; }
        .btn-orig { background-color: #3498db; }
        .btn-kara { background-color: var(--primary-men); }
        
        #status { text-align: center; font-style: italic; color: #888; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="master-header-container">
        <a href="index.html" class="nav-home">←</a>
        <img src="turntable-Icon.jpg" alt="Logo" class="logo-center">
        <img src="qr-code.png" alt="QR" class="qr-static">
    </div>
    <div class="studio-title"><h1>William H Chan Music Studio</h1></div>
    <div class="divider"></div>
    <input type="text" id="search-box" placeholder="Search Men's singer or song..." onkeyup="filterSongs()">
    
    <div id="status">Syncing Men's Library...</div>
    <div id="song-list-container"></div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSeK0hJoqyYLa5BQLl42QIAHMlbT_0tAa0FxhoBBebSUqV98bwac7ACwQc1y2yA6SLOd1nGvJYD-zLB/pub?gid=0&single=true&output=csv&cache=' + new Date().getTime();

        function renderSongs(data) {
            const container = document.getElementById('song-list-container');
            container.innerHTML = '';
            
            // --- FIXED: Start loop at i = 1 to skip the header row entirely ---
            for (let i = 1; i < data.length; i++) {
                const row = data[i];
                if (!row || row.length < 2) continue; // Skip empty rows

                const artist = row[0] ? row[0].trim() : "";
                const song = row[1] ? row[1].trim() : "";
                
                if (!song) continue; // Only show rows that actually have a song name

                const div = document.createElement('div');
                div.className = 'song-card';
                
                let btns = '';
                if (row[2] && row[2].includes('http')) btns += `<a href="${row[2].trim()}" target="_blank" class="btn btn-orig">SONG</a>`;
                if (row[3] && row[3].includes('http')) btns += `<a href="${row[3].trim()}" target="_blank" class="btn btn-kara">SING</a>`;

                div.innerHTML = `<div class="details"><span class="artist">${artist || 'CHINESE MEN'}</span><span class="song-name">${song}</span></div><div class="actions">${btns}</div>`;
                container.appendChild(div);
            }
            
            document.getElementById('status').style.display = 'none';
        }

        Papa.parse(CSV_URL, {
            download: true,
            header: false,
            complete: function(results) {
                renderSongs(results.data);
            }
        });

        function filterSongs() {
            const term = document.getElementById('search-box').value.toLowerCase();
            const cards = document.getElementsByClassName('song-card');
            for (let card of cards) card.style.display = card.innerText.toLowerCase().includes(term) ? 'flex' : 'none';
        }
    </script>
</body>
</html>
