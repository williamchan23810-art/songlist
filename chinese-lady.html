        tr:nth-child(even) { background: #fafafa; }
        
        /* Link Button Styles */
        .btn-link { 
            text-decoration: none; 
            color: white !important;

        }
        .btn-yt { background: #ff0000; } /* YouTube Red */

        .status-msg { text-align: center; padding: 40px 20px; color: #d81b60; font-weight: bold; }
    </style>
</head>
