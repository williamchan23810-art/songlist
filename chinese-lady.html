<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Lady Songlist - William H Chan Music Studio</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 5px; margin: 0; }
        h1 { text-align: center; color: #d81b60; margin-top: 10px; font-size: 1.3rem; }
        .search-container { text-align: center; margin-bottom: 10px; }
        input[type="text"] { padding: 8px; width: 95%; max-width: 400px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
        
        .table-wrapper { overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 12px; table-layout: auto; }
        
        /* THE FIX: Minimal padding to shorten gaps */
        th, td { 
            padding: 8px 3px; /* Reduced horizontal padding from 10px to 3px */
            text-align: left; 
            border-bottom: 1px solid #ddd; 
            white-space: nowrap; 
        }

        /* Tightening the gap between Column A & B and the buttons */
        td:nth-child(1), td:nth-child(2) {
            padding-right: 5px; 
        }

        /* Keeping the buttons (Col C & D) side-by-side with almost no gap */
        td:nth-child(3), td:nth-child(4) {
            width: 66px;
            padding-left: 1px;
            padding-right: 1px;
        }

        th { background-color: #d81b60; color: white; position: sticky; top: 0; }

        .link-btn {
            display: inline-block;
            padding: 6px 0;
            border-radius: 4px;
            text-decoration: none !important;
            color: white !important;
            font-weight: bold;
            font-size: 11px; 
            text-align: center;
            width: 64px; 
        }
        .btn-orig { background-color: #e74c3c; } 
        .btn-kara { background-color: #3498db; } 

        .back-btn { display: inline-block; margin: 5px; text-decoration: none; color: #d81b60; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Back</a>
    <h1>Chinese Lady Songlist</h1>

    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search...">
    </div>

    <div class="table-wrapper">
        <table id="songTable">
            <thead>
                <tr id="tableHeader"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTFKLWjxEQgV4uXB9v15Bqyoyj57BY_PvPmn70OdDKOgQwvzQ1lAOHr55KsKF5EpHQUA6ZiO5YWGVC5/pub?gid=0&single=true&output=csv';

        async function loadData() {
            try {
                const response = await fetch(sheetUrl);
                const csvData = await response.text();
                const rows = csvData.split(/\r?\n/);
                if (rows.length === 0) return;

                const headers = rows[0].split(',').map(h => h.replace(/"/g, '').trim());
                const headerRow = document.getElementById('tableHeader');
                
                headers.forEach(h => {
                    const th = document.createElement('th');
                    let title = h;
                    if (h.toLowerCase().includes("original")) title = "SONG";
                    if (h.toLowerCase().includes("karaoke")) title = "KARAOKE";
                    th.innerText = title;
                    headerRow.appendChild(th);
                });

                const tableBody = document.getElementById('tableBody');
                for (let i = 1; i < rows.length; i++) {
                    const columns = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (columns.join('').trim() === "") continue;
                    const tr = document.createElement('tr');
                    columns.forEach((cell, index) => {
                        const td = document.createElement('td');
                        let cleanCell = cell.replace(/"/g, '').trim();
                        if (cleanCell.toLowerCase().startsWith('http')) {
                            const btn = document.createElement('a');
                            btn.href = cleanCell;
                            btn.target = "_blank";
                            btn.className = 'link-btn';
                            if (headers[index].toLowerCase().includes("original")) {
                                btn.innerText = "Original";
                                btn.classList.add('btn-orig');
                            } else {
                                btn.innerText = "Karaoke";
                                btn.classList.add('btn-kara');
                            }
                            td.appendChild(btn);
                        } else {
                            td.innerText = cleanCell;
                        }
                        tr.appendChild(td);
                    });
                    tableBody.appendChild(tr);
                }
            } catch (e) { console.error(e); }
        }

        function filterTable() {
            let input = document.getElementById("searchInput").value.toUpperCase();
            let rows = document.getElementById("tableBody").getElementsByTagName("tr");
            for (let i = 0; i < rows.length; i++) {
                rows[i].style.display = rows[i].innerText.toUpperCase().includes(input) ? "" : "none";
            }
        }
        loadData();
    </script>
</body>
</html>
