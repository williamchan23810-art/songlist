<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chinese Lady Songs - William H Chan Studio</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f0f2f5; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .nav-bar { width: 100%; max-width: 600px; margin-bottom: 10px; }
        .back-btn { text-decoration: none; color: #d81b60; font-weight: bold; font-size: 1rem; }
        
        .container { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; box-sizing: border-box; min-height: 450px; }
        
        h1 { color: #d81b60; margin: 0 0 10px 0; border-bottom: 2px solid #fce4ec; padding-bottom: 8px; font-size: 1.2rem; }
        #searchBox { width: 100%; padding: 10px; margin-bottom: 12px; border: 2px solid #fce4ec; border-radius: 8px; font-size: 1rem; box-sizing: border-box; outline: none; }

        .table-wrapper { width: 100%; overflow-x: hidden; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; } 
        
        th:nth-child(1), td:nth-child(1) { width: 33%; } 
        th:nth-child(2), td:nth-child(2) { width: 33%; } 
        th:nth-child(3), td:nth-child(3) { width: 17%; text-align: center; } 
        th:nth-child(4), td:nth-child(4) { width: 17%; text-align: center; } 

        th { text-align: left; border-bottom: 2px solid #d81b60; padding: 8px 2px; color: #d81b60; font-size: 0.8rem; }
        td { padding: 10px 2px; border-bottom: 1px solid #eee; color: #333; font-size: 0.85rem; word-wrap: break-word; vertical-align: middle; }
        tr:nth-child(even) { background: #fafafa; }
        
        .btn-link { text-decoration: none; color: white !important; padding: 6px 0; border-radius: 4px; font-size: 0.6rem; font-weight: bold; display: block; width: 95%; margin: 0 auto; text-align: center; }
        .btn-orig { background: #3498db; }
        .btn-kara { background: #8e44ad; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html" class="back-btn">← Back</a>
    </div>

    <div class="container">
        <h1>Chinese Lady Songs</h1>
        <input type="text" id="searchBox" placeholder="Search singer or song..." onkeyup="filterTable()">

        <div id="loadingMsg" style="text-align:center; padding: 30px; color: #d81b60; font-size: 0.8rem; font-weight: bold;">Syncing Studio Library...</div>

        <div class="table-wrapper">
            <table id="songTable" style="display:none;">
                <thead>
                    <tr>
                        <th>ARTIST</th>
                        <th>SONG</th>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTFKLWjxEQgV4uXB9v15Bqyoyj57BY_PvPmn70OdDKOgQwvzQ1lAOHr55KsKF5EpHQUA6ZiO5YWGVC5/pub?gid=0&single=true&output=csv&v=' + Date.now();

        async function loadSongs() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                const rows = data.split(/\r?\n/);
                const tableBody = document.getElementById('tableBody');
                tableBody.innerHTML = "";

                for (let i = 1; i < rows.length; i++) {
                    const line = rows[i].trim();
                    if (!line) continue;
                    const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    
                    if (cols.length >= 2) {
                        const tr = document.createElement('tr');
                        const artist = cols[0].replace(/"/g, '').trim();
                        const song = cols[1].replace(/"/g, '').trim();
                        
                        let origBtn = "<td>-</td>";
                        if (cols[2] && cols[2].toLowerCase().includes('http')) {
                            origBtn = `<td><a href="${cols[2].replace(/"/g, '')}" target="_blank" class="btn-link btn-orig">SONG</a></td>`;
                        }

                        let karaBtn = "<td>-</td>";
                        if (cols[3] && cols[3].toLowerCase().includes('http')) {
                            karaBtn = `<td><a href="${cols[3].replace(/"/g, '')}" target="_blank" class="btn-link btn-kara">SING</a></td>`;
                        }

                        tr.innerHTML = `<td>${artist}</td><td>${song}</td>${origBtn}${karaBtn}`;
                        tableBody.appendChild(tr);
                    }
                }
                document.getElementById('loadingMsg').style.display = 'none';
                document.getElementById('songTable').style.display = 'table';
            } catch (err) {
                document.getElementById('loadingMsg').innerText = "Sync delayed. Refresh page.";
            }
        }

        function filterTable() {
            const input = document.getElementById('searchBox').value.toUpperCase();
            const rows = document.getElementById('tableBody').getElementsByTagName('tr');
            for (let row of rows) {
                row.style.display = row.innerText.toUpperCase().includes(input) ? "" : "none";
            }
        }
        loadSongs();
    </script>
</body>
</html>
