<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Lady Songs - William H Chan Studio</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .nav-bar { width: 100%; max-width: 600px; margin-bottom: 20px; }
        .back-btn { display: inline-block; text-decoration: none; background-color: #d81b60; color: white; padding: 12px 24px; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 95%; max-width: 600px; position: relative; min-height: 300px; }
        
        .qr-header { position: absolute; top: 20px; right: 20px; text-align: center; }
        .qr-header img { width: 65px; height: 65px; border: 1px solid #eee; border-radius: 4px; }
        .qr-header p { font-size: 0.6rem; margin: 3px 0 0 0; color: #d81b60; font-weight: bold; }

        h1 { color: #d81b60; margin-top: 0; padding-right: 80px; font-size: 1.5rem; border-bottom: 2px solid #fce4ec; padding-bottom: 10px; }
        #searchBox { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; border-bottom: 2px solid #d81b60; padding: 12px; color: #d81b60; }
        td { padding: 12px; border-bottom: 1px solid #f0f0f0; color: #333; }
        tr:nth-child(even) { background: #fafafa; }
        
        .status-msg { text-align: center; padding: 40px 20px; color: #d81b60; font-weight: bold; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html" class="back-btn">← Back to Menu</a>
    </div>

    <div class="container">
        <div class="qr-header">
            <a href="javascript:void(0);" onclick="alert('To Install:\n1. Tap the Share icon (square with arrow)\n2. Select \'Add to Home Screen\'')">
                <img src="qr-code.png" alt="Install">
                <p>INSTALL</p>
            </a>
        </div>

        <h1>Chinese Lady Songs</h1>
        
        <input type="text" id="searchBox" placeholder="Search singer or song name..." onkeyup="filterTable()">

        <div id="status" class="status-msg">Loading Studio Library...</div>

        <table id="songTable" style="display:none;">
            <thead>
                <tr>
                    <th>Artist (歌手)</th>
                    <th>Song Title (歌名)</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        // Your Verified Google Sheet Link
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTFKLWjxEQgV4uXB9v15Bqyoyj57BY_PvPmn70OdDKOgQwvzQ1lAOHr55KsKF5EpHQUA6ZiO5YWGVC5/pub?gid=0&single=true&output=csv'; 

        async function loadSongs() {
            try {
                const response = await fetch(sheetUrl);
                const data = await response.text();
                
                // Smart Split: Handles both Windows and Mac line endings
                const rows = data.split(/\r?\n/);
                const tableBody = document.getElementById('tableBody');
                
                // Clear existing content just in case
                tableBody.innerHTML = "";

                // Starts at 1 to skip the header ("Artist", "Song")
                for (let i = 1; i < rows.length; i++) {
                    const line = rows[i].trim();
                    if (!line) continue; // Skip empty rows

                    // Split by comma, but be careful with quotes
                    const columns = line.split(',');
                    
                    if (columns.length >= 2) {
                        const tr = document.createElement('tr');
                        const artist = columns[0].replace(/"/g, '').trim();
                        const song = columns[1].replace(/"/g, '').trim();
                        
                        tr.innerHTML = `<td>${artist}</td><td>${song}</td>`;
                        tableBody.appendChild(tr);
                    }
                }

                // HIDE the status message and SHOW the table
                document.getElementById('status').style.display = 'none';
                document.getElementById('songTable').style.display = 'table';
