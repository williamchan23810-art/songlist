<script>
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTFKLWjxEQgV4uXB9v15Bqyoyj57BY_PvPmn70OdDKOgQwvzQ1lAOHr55KsKF5EpHQUA6ZiO5YWGVC5/pub?gid=0&single=true&output=csv';

    async function loadData() {
        const response = await fetch(sheetUrl);
        const data = await response.text();
        const rows = data.split('\n').map(row => row.split(','));

        const header = rows[0];
        const body = rows.slice(1);

        const headerRow = document.getElementById('tableHeader');
        header.forEach(col => {
            const th = document.createElement('th');
            th.innerText = col.trim();
            headerRow.appendChild(th);
        });

        const tableBody = document.getElementById('tableBody');
        body.forEach(row => {
            if (row.join('').trim() === "") return; 
            const tr = document.createElement('tr');
            
            row.forEach((cell, index) => {
                const td = document.createElement('td');
                const cellText = cell.trim();

                // Check if the cell text looks like a YouTube/Web link
                if (cellText.startsWith('http')) {
                    const btn = document.createElement('a');
                    btn.href = cellText;
                    btn.target = "_blank"; // Opens in new tab
                    btn.style.display = "inline-block";
                    btn.style.padding = "5px 10px";
                    btn.style.borderRadius = "5px";
                    btn.style.textDecoration = "none";
                    btn.style.color = "white";
                    btn.style.fontSize = "12px";
                    btn.style.fontWeight = "bold";

                    // Logic to label the button based on the column header
                    const columnHeader = header[index].toLowerCase();
                    if (columnHeader.includes("original")) {
                        btn.innerText = "Original Song";
                        btn.style.backgroundColor = "#e74c3c"; // Red for Original
                    } else if (columnHeader.includes("karaoke")) {
                        btn.innerText = "Karaoke";
                        btn.style.backgroundColor = "#3498db"; // Blue for Karaoke
                    } else {
                        btn.innerText = "Watch";
                        btn.style.backgroundColor = "#7f8c8d"; // Gray for others
                    }
                    
                    td.appendChild(btn);
                } else {
                    td.innerText = cellText;
                }
                tr.appendChild(td);
            });
            tableBody.appendChild(tr);
        });
    }

    function filterTable() {
        let input = document.getElementById("searchInput").value.toUpperCase();
        let tr = document.getElementById("tableBody").getElementsByTagName("tr");
        for (let i = 0; i < tr.length; i++) {
            let textContent = tr[i].textContent.toUpperCase();
            tr[i].style.display = textContent.includes(input) ? "" : "none";
        }
    }

    loadData();
</script>
