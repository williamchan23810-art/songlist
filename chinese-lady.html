        th { text-align: left; border-bottom: 2px solid #d81b60; padding: 10px; color: #d81b60; font-size: 0.85rem; background: white; }

        .btn-link { text-decoration: none; color: white !important; padding: 6px 10px; border-radius: 5px; font-size: 0.75rem; font-weight: bold; display: inline-block; text-align: center; min-width: 80px; }

    </style>
