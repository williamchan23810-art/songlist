<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Lady Songs - William H Chan Studio</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .nav-bar { width: 100%; max-width: 800px; margin-bottom: 10px; }
        .back-btn { text-decoration: none; color: #d81b60; font-weight: bold; font-size: 1.1rem; }
        
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 800px; box-sizing: border-box; }
        
        h1 { color: #d81b60; margin: 0 0 10px 0; border-bottom: 2px solid #fce4ec; padding-bottom: 10px; font-size: 1.5rem; }
        
        #searchBox { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #fce4ec; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }

        .table-wrapper { overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { text-align: left; border-bottom: 2px solid #d81b60; padding: 10px; color: #d81b60; font-size: 0.9rem; }
        td { padding: 10px; border-bottom: 1px solid #eee; color: #333; font-size: 1rem; }
        
        .btn-link { text-decoration: none; color: white !important; padding: 6px 10px; border-radius: 5px; font-size: 0.75rem; font-weight: bold; display: inline-block; }
        .btn-orig { background: #3498db; }
        .btn-kara { background: #8e44ad; }
        
        .install-hint { font-size: 0.8rem; color: #666; margin-top: 15px; text-align: center; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html" class="back-btn">← Back to Menu</a>
    </div>

    <div class="container">
        <h1>Chinese Lady Songs</h1>
        
        <input type="text" id="searchBox" placeholder="Search singer or song..." onkeyup="filterTable()">

        <div id="loadingMsg" style="text-align:center; padding: 20px; color: #d81b60;">Syncing with Studio Library...</div>

        <div class="table-wrapper">
            <table id="songTable" style="display:none;">
                <thead>
                    <tr>
                        <th>ARTIST</th>
                        <th>SONG</th>
                        <th>ORIGINAL</th>
                        <th>KARAOKE</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="install-hint">
            <strong>To Install:</strong> Tap the Share icon at the bottom of Safari and select "Add to Home Screen".
        </div>
    </div>

    <script>
        // The URL of your Google Sheet CSV
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTFKLWjxEQgV4uXB9v15Bqyoyj57BY_PvPmn70OdDKOgQwvzQ1lAOHr55KsKF5EpHQUA6ZiO5YWGVC5/pub?gid=0&single=true&output=csv';

        fetch(csvUrl + '&cb=' + Date.now())
            .then(response => response.text())
            .then(data => {
                const rows = data.split(/\r?\n/);
                const tableBody = document.getElementById('tableBody');
                
                for (let i = 1; i < rows.length; i++) {
                    const line = rows[i].trim();
                    if (!line) continue;
                    
                    const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (cols.length >= 2) {
                        const tr = document.createElement('tr');
                        const artist = cols[0].replace(/"/g, '').trim();
                        const song = cols[1].replace(/"/g, '').trim();
                        
                        let origBtn = "-";
                        if (cols[2] && cols[2].includes('http')) {
                            origBtn = `<a href="${cols[2].replace(/"/g, '')}" target="_blank" class="btn-link btn-orig">ORIGINAL</a>`;
                        }

                        let karaBtn = "-";
                        if (cols[3] && cols[3].includes('http')) {
                            karaBtn = `<a href="${cols[3].replace(/"/g, '')}" target="_blank" class="btn-link btn-kara">KARAOKE</a>`;
                        }

                        tr.innerHTML = `<td>${artist}</td><td>${song}</td><td>${origBtn}</td><td>${karaBtn}</td>`;
                        tableBody.appendChild(tr);
                    }
                }
                document.getElementById('loadingMsg').style.display = 'none';
                document.getElementById('songTable').style.display = 'table';
            })
            .catch(err => {
                document.getElementById('loadingMsg').innerText = "Sync delayed. Please refresh Safari.";
            });

        function filterTable() {
            const input = document.getElementById('searchBox').value.toUpperCase();
            const rows = document.getElementById('tableBody').getElementsByTagName('tr');
            for (let row of rows) {
                row.style.display = row.innerText.toUpperCase().includes(input) ? "" : "none";
            }
        }
    </script>
</body>
</html>
