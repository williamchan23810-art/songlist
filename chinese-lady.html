<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Lady Songlist - William H Chan Music Studio</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        h1 { text-align: center; color: #d81b60; } /* A slight color variation for the Lady list */
        .search-container { text-align: center; margin-bottom: 20px; }
        input[type="text"] { padding: 10px; width: 60%; border: 1px solid #ddd; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #d81b60; color: white; cursor: pointer; }
        tr:hover { background-color: #f1f1f1; }
        .back-btn { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #d81b60; font-weight: bold; }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Back to Home</a>
    <h1>Chinese Lady Songlist</h1>

    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search by Song Name or Artist...">
    </div>

    <table id="songTable">
        <thead>
            <tr id="tableHeader"></tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTFKLWjxEQgV4uXB9v15Bqyoyj57BY_PvPmn70OdDKOgQwvzQ1lAOHr55KsKF5EpHQUA6ZiO5YWGVC5/pub?gid=0&single=true&output=csv';

        async function loadData() {
            const response = await fetch(sheetUrl);
            const data = await response.text();
            const rows = data.split('\n').map(row => row.split(','));

            const header = rows[0];
            const body = rows.slice(1);

            const headerRow = document.getElementById('tableHeader');
            header.forEach(col => {
                const th = document.createElement('th');
                th.innerText = col.trim();
                headerRow.appendChild(th);
            });

            const tableBody = document.getElementById('tableBody');
            body.forEach(row => {
                if (row.join('').trim() === "") return; // Skip empty rows
                const tr = document.createElement('tr');
                row.forEach(cell => {
                    const td = document.createElement('td');
                    td.innerText = cell.trim();
                    tr.appendChild(td);
                });
                tableBody.appendChild(tr);
            });
        }

        function filterTable() {
            let input = document.getElementById("searchInput").value.toUpperCase();
            let tr = document.getElementById("tableBody").getElementsByTagName("tr");
            for (let i = 0; i < tr.length; i++) {
                let textContent = tr[i].textContent.toUpperCase();
                tr[i].style.display = textContent.includes(input) ? "" : "none";
            }
        }

        loadData();
    </script>

</body>
</html>
