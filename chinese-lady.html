<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Lady Songs - William H Chan Studio</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-bar { width: 100%; max-width: 600px; margin-bottom: 10px; }
        
        .back-btn {
            text-decoration: none;
            color: #d81b60;
            font-weight: bold;
            font-size: 1rem;
        }

        /* Restored White Background Container */
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            width: 95%; 
            max-width: 600px;
            position: relative; /* Needed for top-right placement */
        }

        /* QR Code positioned in Top Right */
        .qr-header {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: center;
            width: 80px;
        }

        .qr-header img {
            width: 70px;
            height: 70px;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
        }

        .qr-header p {
            font-size: 0.6rem;
            margin: 5px 0 0 0;
            color: #666;
            font-weight: bold;
            line-height: 1;
        }

        h1 { color: #d81b60; margin-top: 0; padding-right: 90px; } /* Space for QR */

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; border-bottom: 2px solid #d81b60; padding: 10px; color: #d81b60; }
        td { padding: 12px 10px; border-bottom: 1px solid #eee; color: #333; }
        tr:nth-child(even) { background: #f9f9f9; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html" class="back-btn">← Back to Menu</a>
    </div>

    <div class="container">
        <div class="qr-header">
            <a href="javascript:void(0);" onclick="alert('To Install:\n1. Tap Share\n2. Add to Home Screen')">
                <img src="qr-code.png" alt="Tap to Install">
                <p>Tap to Install</p>
            </a>
        </div>

        <h1>Chinese Lady Songs</h1>
        
        <table>
            <thead>
                <tr>
                    <th>Artist</th>
                    <th>Song Title</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Winnie Hsin 辛曉琪</td>
                    <td>Understanding (領悟)</td>
                </tr>
                <tr>
                    <td>Faye Wong 王菲</td>
                    <td>Red Beans (紅豆)</td>
                </tr>
                </tbody>
        </table>
    </div>

</body>
</html>
