<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Lady Songs - William H Chan Studio</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-bar { width: 100%; max-width: 600px; margin-bottom: 15px; }
        
        .back-btn {
            text-decoration: none;
            color: #d81b60;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            width: 95%; 
            max-width: 600px;
            position: relative; 
        }

        /* QR Code Top Right */
        .qr-header {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: center;
        }

        .qr-header img {
            width: 65px;
            height: 65px;
            border: 1px solid #eee;
            border-radius: 4px;
        }

        .qr-header p {
            font-size: 0.6rem;
            margin: 3px 0 0 0;
            color: #d81b60;
            font-weight: bold;
        }

        h1 { color: #d81b60; margin-top: 0; padding-right: 80px; font-size: 1.5rem; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; border-bottom: 2px solid #d81b60; padding: 10px; color: #d81b60; }
        td { padding: 12px 10px; border-bottom: 1px solid #f0f0f0; color: #333; font-size: 1rem; }
        tr:nth-child(even) { background: #fafafa; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html" class="back-btn">← Back to Menu</a>
    </div>

    <div class="container">
        <div class="qr-header">
            <a href="javascript:void(0);" onclick="alert('To Install:\n1. Tap the Share icon\n2. Select \'Add to Home Screen\'')">
                <img src="qr-code.png" alt="Install">
                <p>INSTALL</p>
            </a>
        </div>

        <h1>Chinese Lady Songs</h1>
        
        <table>
            <thead>
                <tr>
                    <th>Artist</th>
                    <th>Song Title</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>辛曉琪</td><td>領悟</td></tr>
                <tr><td>王菲</td><td>紅豆</td></tr>
                <tr><td>葉蒨文</td><td>祝福</td></tr>
                <tr><td>陳慧嫻</td><td>千千闕歌</td></tr>
                <tr><td>梅艷芳</td><td>夕陽之歌</td></tr>
                <tr><td>林憶蓮</td><td>至少還有你</td></tr>
                </tbody>
        </table>
    </div>

</body>
</html>
