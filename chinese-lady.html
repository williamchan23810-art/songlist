<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Lady Songs - William H Chan Studio</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Immersive Background */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('JP.jpg'); 
            background-size: cover;
            background-position: center;
            filter: sepia(100%) hue-rotate(-20deg) brightness(0.7);
            opacity: 0.4;
            z-index: -1;
        }

        .nav-bar {
            width: 100%;
            padding: 15px;
            display: flex;
            justify-content: flex-start;
            z-index: 10;
        }

        .back-btn {
            background: rgba(216, 27, 96, 0.9);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.7);
            padding: 25px;
            border-radius: 20px;
            margin: 10px 0 40px 0;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 { text-align: center; color: #d81b60; margin-top: 0; text-shadow: 2px 2px 4px black; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; border-bottom: 2px solid #d81b60; padding: 12px; color: #d81b60; font-size: 1.1rem; }
        td { padding: 15px 12px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 1rem; }
        tr:nth-child(even) { background: rgba(255, 255, 255, 0.05); }

        /* QR Install Section */
        .qr-section {
            margin-top: 40px;
            text-align: center;
            padding: 20px;
            border-top: 1px dashed rgba(216, 27, 96, 0.5);
        }

        .qr-section a { text-decoration: none; }

        .qr-section img {
            width: 130px;
            height: 130px;
            margin-top: 15px;
            border: 3px solid white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            transition: transform 0.2s;
        }

        .qr-section img:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html" class="back-btn">← Back to Menu</a>
    </div>

    <div class="container">
        <h1>Chinese Lady Songs</h1>
        
        <table>
            <thead>
                <tr>
                    <th>Artist</th>
                    <th>Song Title</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>Winnie Hsin</td><td>Understanding (領悟)</td></tr>
                <tr><td>Faye Wong</td><td>Red Beans (紅豆)</td></tr>
                <tr><td>Sandy Lam</td><td>At Least I Still Have You</td></tr>
                <tr><td>Anita Mui</td><td>Song of the Sunset</td></tr>
            </tbody>
        </table>

        <div class="qr-section">
            <a href="javascript:void(0);" onclick="alert('To Install this App:\n\n1. Tap the Share icon (square with arrow) at the bottom.\n2. Scroll down and tap \'Add to Home Screen\'.\n3. Tap \'Add\' at the top right.')">
                <p style="color: #FFD700; font-weight: bold; font-size: 1.1rem; margin: 0; text-shadow: 1px 1px 2px black;">
                    Tap to Install this App
                </p>
                <img src="qr-code.png" alt="Scan or Tap to Install">
            </a>
            <p style="font-size: 0.8rem; color: #bbb; margin-top: 10px;">
                (Or scan if on a computer)
            </p>
        </div>
    </div>

</body>
</html>
