<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Lady Songs - William H Chan Studio</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .nav-bar { width: 100%; max-width: 900px; margin-bottom: 15px; }
        .back-btn { display: inline-block; text-decoration: none; background-color: #d81b60; color: white; padding: 10px 20px; border-radius: 8px; font-weight: bold; }
        
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 900px; position: relative; min-height: 400px; box-sizing: border-box; }
        
        .qr-header { position: absolute; top: 15px; right: 15px; text-align: center; cursor: pointer; z-index: 10; }
        .qr-header img { width: 55px; height: 55px; border: 1px solid #ddd; border-radius: 5px; }
        .qr-header p { font-size: 0.5rem; margin: 2px 0 0 0; color: #d81b60; font-weight: bold; }

        h1 { color: #d81b60; margin: 0 0 15px 0; padding-right: 75px; font-size: 1.4rem; border-bottom: 2px solid #fce4ec; padding-bottom: 10px; }
        #searchBox { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #fce4ec; border-radius: 8px; font-size: 1rem; box-sizing: border-box; outline: none; }
        #searchBox:focus { border-color: #d81b60; }

        .table-wrapper { overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 550px; }
        th { text-align: left; border-bottom: 2px solid #d81b60; padding: 12px; color: #d81b60; font-size: 0.85rem; background: white; }
        td { padding: 12px; border-bottom: 1px solid #eee; color: #333; font-size: 1rem; }
        tr:nth-child(even) { background: #fafafa; }
        
        .btn-link { text-decoration: none; color: white !important; padding: 6px 10px; border-radius: 5px; font-size: 0.75rem; font-weight: bold; display: inline-block; text-align: center; min-width: 85px; }
        .btn-orig { background: #3498db; }
        .btn-kara { background: #8e44ad; }

        #status { text-align: center; padding: 50px; color: #d81b60; font-weight: bold; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html" class="back-btn">← Back to Menu</a>
    </div>

    <div class="container">
        <div class="qr-header" onclick="showInstructions()">
            <img src="qr-code.png" alt="Install">
            <p>INSTALL</p>
        </div>

        <h1>Chinese Lady Songs</h1>
        <input type="text" id="searchBox" placeholder="Search singer or song..." onkeyup="filterTable()">

        <div id="status">Syncing Studio Library...</div>

        <div class="table-wrapper">
            <table id="songTable" style="display:none;">
                <thead>
                    <tr>
                        <th>ARTIST</th>
                        <th>SONG</th>
                        <th>ORIGINAL</th>
                        <th>KARAOKE</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // 1. DATA LOADING
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTFKLWjxEQgV4uXB9v15Bqyoyj57BY_PvPmn70OdDKOgQwvzQ1lAOHr55KsKF5EpHQUA6ZiO5YWGVC5/pub?gid=0&single=true&output=csv&v=' + Date.now();

        async function loadSongs() {
            try {
                const response = await fetch(sheetUrl);
                const data = await response.text();
                const lines = data.split(/\r?\n/);
                const tableBody = document.getElementById('tableBody');
                
                tableBody.innerHTML = "";

                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    
                    if (cols.length >= 2) {
                        const tr = document.createElement('tr');
                        const artist = cols[0].replace(/^"|"$/g, '').trim();
                        const song = cols[1].replace(/^"|"$/g, '').trim();
                        
                        let origCell = "<td>-</td>";
                        if (cols[2] && cols[2].toLowerCase().includes('http')) {
                            let url = cols[2].replace(/^"|"$/g, '').trim();
                            origCell = `<td><a href="${url}" target="_blank" class="btn-link btn-orig">ORIGINAL 🎵</a></td>`;
                        }

                        let karaCell = "<td>-</td>";
                        if (cols[3] && cols[3].toLowerCase().includes('http')) {
                            let url = cols[3].replace(/^"|"$/g, '').trim();
                            karaCell = `<td><a href="${url}" target="_blank" class="btn-link btn-kara">KARAOKE 🎤</a></td>`;
                        }

                        tr.innerHTML = `<td>${artist}</td><td>${song}</td>${origCell}${karaCell}`;
                        tableBody.appendChild(tr);
                    }
                }
                document.getElementById('status').style.display = 'none';
                document.getElementById('songTable').style.display = 'table';
            } catch (e) {
                document.getElementById('status').innerText = "Connecting...";
            }
        }

        // 2. SEARCH LOGIC
        function filterTable() {
            let val = document.getElementById('searchBox').value.toUpperCase();
            let rows = document.getElementById('tableBody').getElementsByTagName('tr');
            for (let row of rows) {
                row.style.display = row.innerText.toUpperCase().includes(val) ? "" : "none";
            }
        }

        // 3. INSTALL LOGIC (Wrapped in a try/catch to prevent crashing)
        function showInstructions() {
            try {
                const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                if (isMobile) {
                    alert('To Install on Phone:\n1. Tap Share\n2. Select "Add to Home Screen"');
                } else {
                    alert('To Install on Desktop:\n1. Look at browser address bar\n2. Click the [Install] icon on the far right');
                }
            } catch (err) {
                console.log("Install prompt error prevented");
            }
        }

        window.onload = loadSongs;
    </script>
</body>
</html>
