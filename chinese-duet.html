<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Duet Songlist - William H Chan Music Studio</title>
    <style>
        /* Purple theme for Duets */
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 5px; margin: 0; }
        h1 { text-align: center; color: #8e44ad; margin-top: 10px; font-size: 1.2rem; }
        .search-container { text-align: center; margin-bottom: 10px; }
        input[type="text"] { padding: 8px; width: 92%; max-width: 400px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
        .table-wrapper { width: 100%; overflow-x: auto; }
        table { border-collapse: collapse; background: white; font-size: 11.5px; width: 100%; table-layout: auto; }
        th, td { padding: 8px 2px; border-bottom: 1px solid #ddd; white-space: nowrap; }
        td:nth-child(2) { padding-right: 4px; width: 1%; }
        td:nth-child(3) { width: 75px; padding-left: 0px; padding-right: 1px; text-align: right; }
        td:nth-child(4) { width: 75px; padding-left: 1px; padding-right: 0px; text-align: left; }
        th { background-color: #8e44ad; color: white; text-align: left; padding: 8px 4px; }
        .link-btn { display: inline-block; padding: 6px 0; border-radius: 4px; text-decoration: none !important; color: white !important; font-weight: bold; font-size: 9.5px; text-align: center; width: 72px; }
        .btn-orig { background-color: #e74c3c; } 
        .btn-kara { background-color: #3498db; } 
        .back-btn { display: inline-block; margin: 5px; text-decoration: none; color: #8e44ad; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Chinese Duet Songlist</h1>
    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search...">
    </div>
    <div class="table-wrapper">
        <table id="songTable">
            <thead><tr id="tableHeader"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR-cGrii8LceA3d1lC3Xs9NJ1FZvLMWApMVaubht97n5KGmvH_k1W8R75e-45UBc6gW9qo8HwM90Gcb/pub?gid=0&single=true&output=csv';
        
        async function loadData() {
            try {
                const response = await fetch(sheetUrl);
                const data = await response.text();
                const rows = data.split(/\r?\n/);
                const tableHeader = document.getElementById('tableHeader');
                const tableBody = document.getElementById('tableBody');

                const displayHeaders = ["ARTIST", "TITLE", "", ""];
                displayHeaders.forEach(h => {
                    const th = document.createElement('th');
                    th.innerText = h;
                    tableHeader.appendChild(th);
                });

                rows.forEach((row, i) => {
                    if (i === 0 || row.trim() === "") return;
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    const tr = document.createElement('tr');
                    
                    cols.forEach((cell, index) => {
                        if (index > 3) return;
                        const td = document.createElement('td');
                        let clean = cell.replace(/"/g, '').trim();
                        
                        if (clean.toLowerCase().startsWith('http')) {
                            const a = document.createElement('a');
                            a.href = clean;
                            a.target = "_blank";
                            a.className = 'link-btn ' + (index === 2 ? 'btn-orig' : 'btn-kara');
                            a.innerText = (index === 2 ? 'Original' : 'Karaoke');
                            td.appendChild(a);
                        } else {
                            td.innerText = clean;
                        }
                        tr.appendChild(td);
                    });
                    tableBody.appendChild(tr);
                }
            } catch (err) { console.error("Error loading CSV:", err); }
        }

        function filterTable() {
            let val = document.getElementById("searchInput").value.toUpperCase();
            let rows = document.getElementById("tableBody").getElementsByTagName("tr");
            for (let i = 0; i < rows.length; i++) {
                rows[i].style.display = rows[i].innerText.toUpperCase().includes(val) ? "" : "none";
            }
        }
        loadData();
    </script>
</body>
</html>
